  transform: translateY(0) scale(0.98);
}

/* ── GitHub-style Gym Activity Heatmap ───────────────────── */
.gym-activity-section { margin-bottom: 16px; }
.gym-activity-section:last-child { margin-bottom: 0; }
.gym-activity-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 8px;
}
.gym-activity-score {
  font-family: var(--ff-mono); font-size: 0.72rem; font-weight: 800;
  color: #FFB25A; margin-left: auto; white-space: nowrap;
}
.gym-activity-score span {
  font-family: var(--ff-title); font-size: var(--text-xs); font-weight: 800;
  color: var(--t-3); margin-left: 3px;
  text-transform: uppercase; letter-spacing: 0.1em;
}
.gym-activity-score + .gym-activity-streak { margin-left: 8px; }
.gym-activity-avatar {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.6rem; font-weight: 800; color: #fff;
  text-transform: uppercase; flex-shrink: 0;
}
.gym-activity-name { font-size: 0.76rem; font-weight: 700; }
.gym-activity-streak {
  margin-left: auto; font-size: 0.62rem; font-weight: 700;
  color: var(--accent);
}
.gym-heatmap-wrap {
  overflow-x: auto; scrollbar-width: none;
  padding-bottom: 4px;
}
.gym-heatmap-wrap::-webkit-scrollbar { display: none; }
.gym-heatmap-grid {
  display: grid;
  grid-template-rows: repeat(7, 10px);
  grid-auto-flow: column;
  grid-auto-columns: 10px;
  gap: 2px;
  /* max-content so the scroller measures every column (otherwise the
     grid box stops at the container edge and the last column clips);
     right padding keeps the final week off the clipped edge. */
  width: max-content;
  padding-right: 6px;
}
.gym-heatmap-dot {
  width: 10px; height: 10px;
  border-radius: 2px;
  background: rgba(var(--wht),0.04);
  transition: background 0.2s;
}
.gym-heatmap-dot.g-1 { background: var(--hm-1); }
.gym-heatmap-dot.g-2 { background: var(--hm-2); }
.gym-heatmap-dot.g-3 { background: var(--hm-3); }
.gym-heatmap-dot.g-4 { background: var(--hm-4); }
/* Days that included cardio get a pink tint per intensity level */
.gym-heatmap-dot.g-cardio.g-1 { background: rgba(255,55,95,0.25); }
.gym-heatmap-dot.g-cardio.g-2 { background: rgba(255,55,95,0.45); }
.gym-heatmap-dot.g-cardio.g-3 { background: rgba(255,55,95,0.7); }
.gym-heatmap-dot.g-cardio.g-4 { background: #FF375F; }
.gym-heatmap-legend {
  display: flex; align-items: center; gap: 4px;
  justify-content: flex-end; margin-top: 6px;
  font-size: var(--text-xs); color: var(--t-3);
}
.gym-heatmap-legend-dot {
  width: 10px; height: 10px; border-radius: 2px;
}

/* Bare variant (profile hero): no avatar/name — the hero already has them */
.gym-activity-header-bare { justify-content: flex-end; min-height: 0; }

/* Profile-hero activity monitor */
.profile-heatmap { margin: 0 0 14px; text-align: left; }
.profile-heatmap .gym-activity-section { margin-bottom: 0; }

/* ── Head-to-Head Comparison ─────────────────────────────── */
.h2h-picker {
  display: flex; gap: 8px; align-items: center;
  padding-bottom: 12px;
}
.h2h-vs {
  font-size: 0.68rem; font-weight: 900;
  color: var(--t-3); text-transform: uppercase;
  letter-spacing: 0.08em;
}
.h2h-select {
  flex: 1; padding: 8px 12px;
  font-size: 0.76rem; font-weight: 600;
  background: rgba(var(--wht),0.04);
  border: 1px solid rgba(var(--wht),0.08);
  border-radius: var(--r-md, 10px);
  color: #fff; cursor: pointer;
}
.h2h-body { min-height: 40px; }
.h2h-legend {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; padding: 2px 2px 10px;
}
.h2h-chip {
  display: flex; align-items: center; gap: 7px;
  padding: 5px 11px 5px 6px; border-radius: var(--r-full);
  background: var(--glass-2); border: 1px solid var(--border-light);
  font-size: 0.72rem; font-weight: 700; min-width: 0;
}
.h2h-chip.a { border-color: rgba(var(--accent-rgb), 0.45); }
.h2h-chip.b { border-color: rgba(10, 132, 255, 0.45); }
.h2h-chip-avatar {
  width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.6rem; font-weight: 800; color: #fff;
  text-transform: uppercase; overflow: hidden; flex-shrink: 0;
}
.h2h-chip-name {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  max-width: 72px;
}
.h2h-chip b { font-family: var(--ff-mono); font-size: 0.74rem; font-weight: 800; }
.h2h-chip.a b { color: var(--accent-hi); }
.h2h-chip.b b { color: #64D2FF; }
.h2h-verdict {
  font-family: var(--ff-title); font-size: 0.58rem; font-weight: 800;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--t-3);
  text-align: center;
}
.h2h-radar-wrap {
  display: flex; justify-content: center;
  padding: 8px 0 12px;
}
.h2h-radar-wrap svg { max-width: 320px; }
.h2h-stats-grid {
  display: grid; grid-template-columns: 1fr auto 1fr;
  gap: 6px 12px; font-size: 0.74rem;
}
.h2h-stat-label {
  text-align: center; font-weight: 700;
  color: var(--t-3); font-size: 0.62rem;
  text-transform: uppercase; letter-spacing: 0.04em;
}
.h2h-stat-left {
  text-align: right; font-weight: 800;
  font-family: var(--ff-mono, monospace);
}
.h2h-stat-right {
  text-align: left; font-weight: 800;
  font-family: var(--ff-mono, monospace);
}
.h2h-stat-win { color: var(--accent); }
.h2h-stat-win-b { color: var(--c-blue, #0A84FF); }
.h2h-stat-bar {
  height: 4px; border-radius: 2px;
  background: rgba(var(--wht),0.06);
  grid-column: 1 / -1; margin: -2px 0 4px;
  position: relative; overflow: hidden;
}
.h2h-stat-fill-l {
  position: absolute; right: 50%; top: 0; height: 100%;
  border-radius: 2px 0 0 2px;
  background: linear-gradient(270deg, var(--accent), rgba(255,107,0,0.3));
  transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
}
.h2h-stat-fill-r {
  position: absolute; left: 50%; top: 0; height: 100%;
  border-radius: 0 2px 2px 0;
  background: linear-gradient(90deg, #0A84FF, rgba(10,132,255,0.3));
  transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
}

/* ── Mini Profile Bottom Sheet ───────────────────────────── */
.mini-profile-bg {
  position: fixed; inset: 0; z-index: 9990;
  background: rgba(var(--blk),0.5);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  opacity: 0; visibility: hidden;
  transition: opacity 0.3s, visibility 0.3s;
}
.mini-profile-bg.open { opacity: 1; visibility: visible; }
.mini-profile-sheet {
  position: absolute; bottom: 0; left: 0; right: 0;
  max-height: 70vh; overflow-y: auto;
  background: linear-gradient(180deg, rgba(var(--blk),0.9), rgba(var(--blk),0.98));
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border-radius: 14px 14px 0 0;
  border-top: 1px solid rgba(var(--wht),0.1);
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  padding: 10px 20px 24px;
}
.mini-profile-bg.open .mini-profile-sheet { transform: translateY(0); }
.mini-profile-handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: rgba(var(--wht),0.2);
  margin: 0 auto 12px;
}
.mini-profile-hero {
  text-align: center; margin-bottom: 16px;
}
.mini-profile-avatar {
  width: 64px; height: 64px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem; font-weight: 800; color: #fff;
  text-transform: uppercase; margin: 0 auto 10px;
  box-shadow: 0 4px 16px rgba(var(--blk),0.4);
}
.mini-profile-name { font-size: 1.1rem; font-weight: 800; }
.mini-profile-score { color: #FFB25A; font-family: var(--ff-mono); }

/* Instagram-style recent-session tile grid on the profile sheet */
.mini-profile-tiles-wrap { margin-top: 18px; }
.mini-profile-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.mp-tile {
  display: flex; flex-direction: column; gap: 3px;
  padding: 11px 10px; border-radius: var(--r-s);
  background: rgba(var(--wht),0.04); border: 1px solid var(--border-light);
  border-left: 3px solid var(--dt, var(--accent));
}
.mp-tile-type { font-size: 0.58rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; color: var(--dt, var(--accent)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mp-tile-vol { font-family: var(--ff-mono); font-size: 0.92rem; font-weight: 800; color: var(--t-1); }
.mp-tile-vol em { font-size: 0.56rem; font-style: normal; color: var(--t-3); margin-left: 2px; font-weight: 600; }
.mp-tile-date { font-size: 0.6rem; color: var(--t-3); font-weight: 600; }
.mini-profile-user { font-size: 0.72rem; color: var(--t-3); font-weight: 600; margin-top: 2px; }
.mini-profile-bio { font-size: 0.74rem; color: var(--t-2); font-weight: 500; margin-top: 6px; line-height: 1.4; max-width: 260px; margin-left: auto; margin-right: auto; }
.mini-profile-follows { display: flex; justify-content: center; gap: 16px; margin-top: 8px; font-size: 0.72rem; color: var(--t-3); font-weight: 600; }
.mini-profile-follows b { color: #fff; font-weight: 800; }
.mini-profile-mutual { margin-top: 6px; }
.mini-profile-stats {
  display: flex; justify-content: center; gap: 0;
  margin: 14px 0;
}
.mini-profile-stat {
  flex: 1; text-align: center; padding: 0 8px;
  border-left: 1px solid rgba(var(--wht),0.06);
}
.mini-profile-stat:first-child { border-left: none; }
.mini-profile-stat-val { font-size: 1.1rem; font-weight: 800; }
.mini-profile-stat-label { font-size: 0.56rem; font-weight: 700; color: var(--t-3); text-transform: uppercase; letter-spacing: 0.05em; }
.mini-profile-actions { display: flex; gap: 8px; margin-top: 12px; }
.mini-profile-actions .btn { flex: 1; }
.mini-profile-heatmap { margin-top: 16px; }
.mini-profile-heatmap-title {
  font-size: 0.66rem; font-weight: 700; color: var(--t-3);
  text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;
}

/* ── Follow Button Morphing ──────────────────────────────── */
.user-row .btn {
  transition: background-color var(--dur-fast) var(--bounce), border-color var(--dur-fast) var(--bounce), color var(--dur-fast) var(--bounce), box-shadow var(--dur-fast) var(--bounce), transform var(--dur-fast) var(--bounce), opacity var(--dur-fast) var(--bounce);
}
.user-row .btn:active {
  transform: scale(0.92);
}
.user-row .btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-hi));
  border: none;
}
.user-row .btn-secondary { border: 1px solid rgba(var(--wht),0.15); }

/* ── Apple Liquid Glass Tab Bar — Floating Pill ──────────── */
.bottom-bar {
  position: absolute;
  bottom: calc(10px + var(--sab));
  left: 12px; right: 12px;
  height: 58px;
  background: linear-gradient(180deg, rgba(var(--wht), 0.08) 0%, rgba(var(--wht), 0.02) 100%);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
  border: 1px solid rgba(var(--wht), 0.12);
  border-radius: var(--r-xl);
  display: grid;
  /* ＋ moved to a right-edge floating FAB; nav is a clean equal-width row. */
  grid-template-columns: repeat(4, 1fr);
  align-items: center;
  column-gap: 2px;
  padding: 0 8px;
  z-index: 50;
  box-shadow: inset 0 1px 0 rgba(var(--wht), 0.25),
              inset 0 0 0 0.5px rgba(var(--wht), 0.1),
              0 8px 32px rgba(var(--blk), 0.55);
}
/* Arc ON → 5 equal view slots (Home Arc Social Insights Profile);
   Arc hidden → 4 (Social/Insights/Profile fill the 4 tracks). */
[data-arc="on"] .bottom-bar,
[data-theme="winter"] .bottom-bar {
  grid-template-columns: repeat(5, 1fr) !important;
}
/* Tabs fill their tracks inside the grid */
.bottom-bar > [data-v="Home"] { grid-column: 1; grid-row: 1; }
.bottom-bar > [data-v="Arc"]  { grid-column: 2; grid-row: 1; }
.bottom-bar > [data-v="Soc"]  { grid-column: 3; grid-row: 1; }
.bottom-bar > [data-v="Ana"]  { grid-column: 4; grid-row: 1; }
.bottom-bar > [data-v="Set"]  { grid-column: 5; grid-row: 1; }

.bot-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px;
  background: none; border: none;
  color: var(--t-3); font-size: 0.58rem;
  font-weight: 700; font-family: var(--ff-sans);
  cursor: pointer; transition: var(--t-ui-slow);
  width: 100%;
  height: 46px;
  min-height: 44px;
  padding: 6px 4px;
  border-radius: var(--r-m); outline: none;
  position: relative;
  z-index: 2;
}
/* force the same hit area for every tab so a wider track doesn't distort
   the visual pill; the lens stays pinned to the actual icon+label center. */

.tab-icon {
  width: 20px; height: 20px;
  transition: var(--t-ui-slow);
  color: var(--t-3);
  position: relative;
  z-index: 2;
}

/* Active state: text switches to accent. No enlargement; the lens and the
   icon's accent color are sufficient signal. */
.bot-btn.on { color: var(--t-1); }
.bot-btn.on .tab-icon { color: var(--accent); filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), 0.4)); }
.bot-btn:active .tab-icon { transform: scale(0.88); }

.nav-lens {
  position: absolute;
  width: 48px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.16) 0%, rgba(var(--accent-rgb), 0.06) 100%);
  backdrop-filter: blur(12px) brightness(1.2) saturate(140%);
  -webkit-backdrop-filter: blur(12px) brightness(1.2) saturate(140%);
  border: 1px solid rgba(var(--accent-rgb), 0.3);
  box-shadow: inset 0 1.5px 0 rgba(var(--wht), 0.35),
              inset 0 -1px 0 rgba(var(--blk), 0.15),
              0 0 16px rgba(var(--accent-rgb), 0.15),
              0 4px 10px rgba(var(--blk), 0.25);
  z-index: 1;
  pointer-events: none;
  display: none;
  transform: scale(1);
}

.nav-lens.stretching {
  transform: scale(1.22);
}

/* ── Session Hero Button — center ＋ in the tab bar ──────────────
   An action, not a tab: never carries .on, never gets the nav-lens.
   Breaks out of the pill (larger than the bar, overlapping its top
   edge) so the one thing you do most reads as the one big control. */
.bot-btn-hero {
  position: absolute;
  right: 14px;
  bottom: calc(76px + var(--sab)); /* bar 58px + gap 8px */
  width: 58px; height: 58px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-hi), var(--accent));
  color: var(--bg);
  box-shadow: 0 10px 26px rgba(var(--accent-rgb), 0.5),
              0 2px 8px rgba(var(--blk), 0.5),
              inset 0 1px 0 rgba(var(--wht), 0.4);
  transition: var(--t-ui-slow);
  z-index: 55; /* above the bottom bar */
}
.bot-btn-hero:active { transform: scale(var(--press-scale)); }
.bot-btn-hero svg {
  width: 24px; height: 24px;
  color: var(--bg);
  filter: drop-shadow(0 1px 1px rgba(var(--wht), 0.25));
}

/* ── Workout Session Overlay — Home's ＋ target ─────────────────
   position:fixed inset:0 (viewport-fixed; the phone frame carries a
   transform that would break fixed descendants, so app.js appends
   the overlay to <body> at boot). Solid --bg, no blur: data surfaces
   stay flat so the glass navbar visually floats above a clean sheet. */
.session-overlay {
  position: fixed; inset: 0;
  z-index: 80;
  display: flex; flex-direction: column;
  background: var(--bg);
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  padding-top: var(--sat);
}
.session-overlay.open { transform: translateY(0); }
.session-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px;
  border-bottom: 1px solid rgba(var(--wht), 0.08);
  flex-shrink: 0;
}
.session-title {
  font-family: var(--ff-title);
  font-size: 1.3rem; font-weight: 800;
  letter-spacing: -0.02em;
}
.session-subtitle {
  font-size: 0.72rem; font-weight: 600;
  color: var(--t-3); margin-top: 2px;
}
.session-close { flex-shrink: 0; }
.session-body {
  flex: 1; overflow-y: auto;
  padding: 16px 16px calc(24px + var(--sab)) 16px;
  display: flex; flex-direction: column;
  gap: var(--space-4);
}
.session-body::-webkit-scrollbar { display: none; }

/* ── Home Start-Workout CTA ───────────────────────────────────── */
.start-workout-cta {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  border-color: var(--border-strong);
}
.start-workout-cta-title { font-weight: 800; font-size: 0.95rem; }
.start-workout-cta-sub { font-size: 0.72rem; color: var(--t-3); margin-top: 2px; }
.start-workout-cta .btn { flex-shrink: 0; padding: 12px 18px; }
.start-workout-cta .btn-icon { font-size: 1.15rem; line-height: 1; font-weight: 600; }
/* Small screens: shrink the CTA — tighter copy, compact button, single line */
@media (max-width: 430px) {
  .start-workout-cta { gap: 8px; }
  .start-workout-cta-title { font-size: 0.85rem; }
  .start-workout-cta-sub { font-size: 0.62rem; margin-top: 1px; }
  .start-workout-cta .btn { padding: 9px 13px; font-size: 0.72rem; white-space: nowrap; }
  .start-workout-cta .btn-icon { font-size: 1rem; }
}
/* Winter: the app is monochrome, so give this one card a quiet ember
   accent — reads as "do this now" without breaking the season. */
[data-theme="winter"] .start-workout-cta {
  border-color: rgba(var(--arc-ember-rgb), 0.4);
  box-shadow: var(--elev-1), 0 0 0 0.5px rgba(var(--arc-ember-rgb), 0.08),
              0 0 20px rgba(var(--arc-ember-rgb), 0.06);
}
[data-theme="winter"] .start-workout-cta .btn-primary {
  background: linear-gradient(135deg, var(--wht) 0%, color-mix(in srgb, var(--wht) 60%, var(--blk)) 100%);
  color: var(--blk);
}

@keyframes glassTabPop {
  from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
  to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

/* kept the lens; removed the .on 1.1 scale so all tabs stay visually uniform */

/* ── Toast Notifications ───────────────────────────────────── */
.toast-wrap {
  position: fixed; top: calc(15px + var(--sat));
  left: 50%; transform: translateX(-50%);
  z-index: 999;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
  width: 90%; max-width: 360px;
}

.toast {
  background: rgba(var(--blk), 0.78);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
  border: 1px solid var(--border-strong);
  border-radius: var(--r-full);
  padding: 10px 18px;
  display: flex; align-items: center; gap: 10px;
  font-weight: 600; font-size: 0.85rem;
  box-shadow: var(--elev-2);
  color: var(--t-1);
  /* A transition, not a keyframe animation: toasts fire in bursts (log a
     set, hit a PR, save a check-in — three in two seconds is normal),
     and a keyframe restarts from its 0% every time, jarring if a second
     toast's DOM node reuses timing while the first is mid-flight. A
     transition instead retargets smoothly from wherever it currently is.
     Enter is slower and eased-out (arriving, the user's attention moves
     to it); exit is quicker (leaving, the system is just tidying up) —
     asymmetric on purpose, not a rounding accident. */
  opacity: 0;
  transform: translateY(-14px) scale(0.94);
  transition: opacity 0.22s cubic-bezier(0.23, 1, 0.32, 1),
              transform 0.22s cubic-bezier(0.23, 1, 0.32, 1);
}
.toast.show { opacity: 1; transform: translateY(0) scale(1); }
.toast.leave {
  transition: opacity 0.15s ease-out, transform 0.15s ease-out;
  opacity: 0;
  transform: translateY(-8px) scale(0.96);
}

.toast-icon-svg { width: 16px; height: 16px; display: flex; align-items: center; flex-shrink: 0; }
.toast.success { border-color: rgba(48, 209, 88, 0.4); }
.toast.success .toast-icon-svg { color: var(--c-green); }
.toast.error { border-color: rgba(255, 69, 58, 0.4); }
.toast.error .toast-icon-svg { color: var(--c-red); }

/* ── Confirm Modals — iOS 27 Liquid Glass ────────────────── */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(var(--blk), 0.55);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  z-index: 900;
  display: none; align-items: center; justify-content: center;
  padding: 20px;
}
.modal-bg.show {
  display: flex;
  animation: fadeIn 0.2s ease forwards;
}

.modal {
  background: linear-gradient(135deg, rgba(var(--wht), 0.08) 0%, rgba(var(--wht), 0.02) 100%);
  backdrop-filter: blur(25px) saturate(190%) brightness(1.1);
  -webkit-backdrop-filter: blur(25px) saturate(190%) brightness(1.1);
  border: 1px solid rgba(var(--wht), 0.1);
  border-radius: var(--r-xl);
  width: 100%; max-width: 340px;
  text-align: center; padding: 28px 24px;
  animation: modalScaleUp 0.3s var(--spring) forwards;
  box-shadow: var(--elev-2);
}

.modal-icon { margin-bottom: 14px; display: flex; justify-content: center; }
.modal-title { font-family: var(--ff-title); font-size: 1.25rem; font-weight: 800; margin-bottom: 6px; }
.modal-msg { font-size: 0.88rem; color: var(--t-2); margin-bottom: 20px; line-height: 1.45; }
.modal-acts { display: flex; gap: 10px; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalScaleUp {
  from { opacity: 0; transform: scale(0.94) translateY(12px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

/* Weight/Level Toggle — iOS 27 Glass */
.toggle-segmented {
  display: flex;
  background: linear-gradient(135deg, rgba(var(--wht), 0.04) 0%, rgba(var(--wht), 0.01) 100%);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
  border-radius: var(--r-m);
  padding: 3px; width: fit-content;
  border: 1px solid rgba(var(--wht), 0.06);
  margin-top: 4px;
  box-shadow: inset 0 1px 0 rgba(var(--wht), 0.1),
              0 2px 8px rgba(var(--blk), 0.2);
}

.segment-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--t-3);
  font-size: 0.72rem; font-weight: 700;
  padding: 5px 12px; border-radius: var(--r-s);
  cursor: pointer; transition: var(--t-ui); outline: none;
}
.segment-btn.active {
  background: linear-gradient(135deg, rgba(var(--wht), 0.12) 0%, rgba(var(--wht), 0.04) 100%);
  color: var(--accent);
  border-color: rgba(var(--wht), 0.08);
  box-shadow: 0 3px 8px rgba(var(--blk), 0.3),
              inset 0 1px 0 rgba(var(--wht), 0.2);
}

/* Note tags */
.note-tags-row {
  display: flex; gap: 6px; margin-top: 0;
  scrollbar-width: none;
  max-height: 0; opacity: 0; overflow: hidden;
  transition: max-height 0.25s var(--spring), opacity 0.2s ease, margin-top 0.2s ease;
}
/* overflow-x must be re-declared here: the collapsed state's `overflow:
   hidden` shorthand would otherwise keep the open row unscrollable. */
.set-notes-wrap:focus-within .note-tags-row {
  max-height: 30px; opacity: 1; margin-top: 5px;
  overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
}
.note-tags-row::-webkit-scrollbar { display: none; }

.note-tag {
  background: rgba(var(--wht), 0.02);
  border: 1px solid rgba(var(--wht), 0.05);
  color: var(--t-3);
  padding: 1px 6px; border-radius: var(--r-full);
  font-size: 0.6rem; cursor: pointer;
  transition: var(--t-ui); font-weight: 600;
  white-space: nowrap; outline: none;
}

@media (hover: hover) and (pointer: fine) {
  .note-tag:hover {   background: rgba(var(--wht), 0.06); color: var(--t-1); border-color: rgba(var(--wht), 0.12); 
  }
}

/* Rest Day Timeline Card */
.tl-rest-card {
  background: linear-gradient(135deg, rgba(255, 159, 10, 0.03), rgba(var(--blk), 0)) !important;
  border-left: 3px solid var(--c-orange) !important;
  border-color: rgba(255, 159, 10, 0.15) !important;
}

.tl-rest-header {
  padding: 16px; display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid rgba(var(--wht), 0.04);
}

.tl-rest-icon-wrap {
  width: 36px; height: 36px;
  border-radius: var(--r-s);
  background: rgba(255, 159, 10, 0.1);
  color: var(--c-orange);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 0 10px rgba(255, 159, 10, 0.15);
}
.tl-rest-icon-wrap svg { width: 18px; height: 18px; }

.tl-rest-body { padding: 16px; }
.tl-recovery-tip-title {
  font-family: var(--ff-serif);
  font-size: 0.95rem; font-weight: 700;
  color: var(--c-orange); margin-bottom: 6px;
}
.tl-recovery-tip { font-size: 0.8rem; color: var(--t-2); line-height: 1.45; margin: 0; }

/* ── Volume Insights ─────────────────────────────────────── */
.volume-insight-card { padding: 16px; margin-bottom: 20px; }

.vol-insight-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 18px;
}

.vol-legend { display: flex; gap: 12px; }
.vol-legend-item { font-size: 0.7rem; color: var(--t-3); display: flex; align-items: center; gap: 5px; font-weight: 600; }

.legend-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.legend-dot.current { background: var(--c-orange); box-shadow: 0 0 6px var(--c-orange); }
.legend-dot.previous { background: rgba(var(--wht), 0.25); }

.vol-insight-list { display: flex; flex-direction: column; gap: 16px; }

.vol-item {
  display: flex; flex-direction: column; gap: 8px;
  padding-bottom: 14px;
  border-bottom: 1px dashed rgba(var(--wht), 0.05);
}
.vol-item:last-child { padding-bottom: 0; border-bottom: none; }

.vol-item-meta { display: flex; justify-content: space-between; align-items: center; }
.vol-name { font-family: var(--ff-serif); font-size: 1.05rem; font-weight: 700; }

.vol-stats { display: flex; align-items: center; gap: 8px; font-family: var(--ff-mono); font-size: 0.82rem; }
.vol-current { font-weight: 800; }
.vol-unit { font-size: 0.7rem; color: var(--t-3); font-weight: 500; }

.vol-compare { font-size: 0.72rem; font-weight: 700; border-radius: 4px; padding: 1px 6px; }
.vol-compare.pos { color: var(--c-green); background: var(--c-green-bg); }
.vol-compare.neg { color: var(--c-red); background: var(--c-red-bg); }
.vol-compare.neutral { color: var(--t-3); background: rgba(var(--wht), 0.05); }

.vol-bars-wrap { display: flex; flex-direction: column; gap: 8px; }
.vol-bar-row { display: flex; align-items: center; gap: 8px; }
.vol-bar-label { font-size: 0.62rem; font-weight: 700; color: var(--t-3); width: 50px; text-transform: uppercase; letter-spacing: 0.03em; }

.vol-bar-track { flex: 1; height: 6px; background: rgba(var(--wht), 0.04); border-radius: var(--r-full); overflow: hidden; }
.vol-bar-fill { height: 100%; border-radius: var(--r-full); transition: width 0.6s var(--spring); }

.vol-bar-fill.current.badge-pull { background: var(--c-blue); box-shadow: 0 0 6px var(--c-blue); }
.vol-bar-fill.current.badge-push { background: var(--c-red); box-shadow: 0 0 6px var(--c-red); }
.vol-bar-fill.current.badge-legs { background: var(--c-green); box-shadow: 0 0 6px var(--c-green); }
.vol-bar-fill.current.badge-shoulders { background: var(--c-orange); box-shadow: 0 0 6px var(--c-orange); }
.vol-bar-fill.current.badge-core { background: var(--c-purple); box-shadow: 0 0 6px var(--c-purple); }
.vol-bar-fill.previous { background: rgba(var(--wht), 0.22); }

.vol-suggestion { display: flex; align-items: flex-start; gap: 8px; margin-top: 4px; }
.vol-status-badge { font-size: 0.62rem; font-weight: 800; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; letter-spacing: 0.03em; flex-shrink: 0; }
.status-under { color: var(--c-orange); background: var(--c-orange-bg); border: 1px solid rgba(255, 159, 10, 0.15); }
.status-optimal { color: var(--c-green); background: var(--c-green-bg); border: 1px solid rgba(48, 209, 88, 0.15); }
.status-high { color: var(--c-red); background: var(--c-red-bg); border: 1px solid rgba(255, 69, 58, 0.15); }
.vol-suggestion-text { font-size: 0.72rem; color: var(--t-2); line-height: 1.35; }

/* Connection Guide */
.connection-guide { margin-top: 16px; border-top: 1px solid rgba(var(--wht), 0.05); padding-top: 14px; }
.guide-toggle { display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 0.78rem; font-weight: 700; color: var(--accent); user-select: none; }
.guide-toggle .chevron-svg { width: 14px; height: 14px; transition: transform 0.25s ease; }
.connection-guide.open .guide-toggle .chevron-svg { transform: rotate(180deg); }
.guide-content { display: none; margin-top: 10px; animation: fadeIn 0.25s ease forwards; }
.connection-guide.open .guide-content { display: block; }
.guide-content ol { margin: 0 0 14px 0; padding-left: 18px; color: var(--t-2); font-size: 0.72rem; line-height: 1.5; }
.guide-content li { margin-bottom: 8px; }
.guide-content code { font-family: var(--ff-mono); background: rgba(var(--wht), 0.05); padding: 1px 4px; border-radius: 4px; color: var(--c-orange); }

/* Timeline Card Actions */
.tl-card-actions {
  display: flex; justify-content: flex-end; gap: 12px;
  padding: 10px 16px;
  background: rgba(var(--wht), 0.015);
  border-top: 1px solid var(--border-light);
}
.tl-action-btn { font-size: 0.72rem; padding: 4px 8px; color: var(--t-2); display: flex; align-items: center; gap: 4px; border-radius: var(--r-xs); transition: var(--t-ui); }

@media (hover: hover) and (pointer: fine) {
  .tl-action-btn:hover {   color: var(--t-1); background: var(--glass-2); 
  }
}
.tl-action-btn.text-danger { color: var(--c-red); }

@media (hover: hover) and (pointer: fine) {
  .tl-action-btn.text-danger:hover {   background: rgba(255, 69, 58, 0.12); 
  }
}
.action-icon-svg { width: 13px; height: 13px; }

/* ── Global Rest Timer — iOS 27 Glass ──────────────────────
   Anchored absolutely inside the phone frame above the bottom bar.
   When a session is open the bar is part of that workflow, so the
   body.session-open rule below lifts it above the overlay's 80. */
.global-timer-bar {
  position: absolute;
  bottom: calc(84px + var(--sab));
  left: 16px; right: 16px; height: 60px;
  background: linear-gradient(180deg, rgba(var(--wht), 0.1) 0%, rgba(var(--wht), 0.03) 100%);
  backdrop-filter: blur(calc(var(--glass-blur) * 1.2)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
  -webkit-backdrop-filter: blur(calc(var(--glass-blur) * 1.2)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
  border: 1px solid rgba(var(--wht), 0.15);
  border-radius: var(--r-xl);
  z-index: 45;
  transition: transform 0.35s var(--spring), opacity 0.3s;
  box-shadow: inset 0 1px 0 rgba(var(--wht), 0.25),
              0 8px 32px rgba(var(--blk), 0.55);
}
.global-timer-bar.hidden { transform: translateY(calc(100% + 12px)); opacity: 0; pointer-events: none; }
.global-timer-bar.visible { transform: translateY(0); opacity: 1; pointer-events: auto; }
/* While the session sheet is up, the rest timer belongs to it — raise it
   above the overlay's 80. The rule keys off a <body> class (not a sibling)
   because the overlay is reparented to <body> at runtime while the bar
   stays inside the frame. */
body.session-open .global-timer-bar { z-index: 85; }

.timer-content { display: flex; align-items: center; justify-content: space-between; height: 100%; padding: 0 10px; gap: 6px; }
.timer-left { display: flex; align-items: center; gap: 6px; }

.timer-ring-wrap {
  position: relative; width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.timer-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.timer-svg-bg { fill: none; stroke: rgba(var(--wht), 0.04); stroke-width: 2.5; }
.timer-svg-fill { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; transition: stroke-dashoffset 0.35s linear; }
.timer-text { font-family: var(--ff-mono); font-size: 0.58rem; font-weight: 700; position: relative; z-index: 2; }
.timer-info { display: flex; flex-direction: column; line-height: 1.2; }
.timer-title { font-family: var(--ff-title); font-size: 0.65rem; font-weight: 800; text-transform: uppercase; color: var(--accent); letter-spacing: 0.05em; }
.timer-desc { font-size: 0.58rem; color: var(--t-3); white-space: nowrap; }

.timer-presets { display: flex; gap: 4px; }

.btn-timer-chip {
  background: var(--glass-2);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border: 1px solid var(--border-light);
  color: var(--t-2);
  padding: 4px 6px; border-radius: var(--r-s);
  font-size: 0.65rem; font-weight: 700;
  cursor: pointer; transition: var(--t-ui-slow); outline: none;
}

@media (hover: hover) and (pointer: fine) {
  .btn-timer-chip:hover {   background: var(--glass-3); color: var(--t-1); border-color: var(--border-strong); 
  }
}
.btn-timer-chip.active { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px var(--accent-bg); }

.timer-adjs { display: flex; gap: 3px; }
.btn-timer-adj {
  padding: 4px 6px; border-radius: var(--r-s);
  background: var(--glass-2);
  border: 1px solid var(--border-light);
  color: var(--t-2); font-size: 0.62rem; font-weight: 700;
  cursor: pointer; transition: var(--t-ui-slow); outline: none;
}
@media (hover: hover) and (pointer: fine) {
  .btn-timer-adj:hover { background: var(--glass-3); color: var(--t-1); }
}
.btn-timer-adj:active { transform: scale(0.92); }

/* ── Plate Calculator popup ──────────────────────────────────
   Pure-math helper that pops next to the weight field on long-press /
   right-click. No library — results are a static "per side: plates" +
   an inline SVG bar diagram. */
.plate-calc {
  position: fixed; z-index: 95; min-width: 220px; max-width: 280px;
  background: linear-gradient(180deg, rgba(var(--wht), 0.1) 0%, rgba(var(--wht), 0.04) 100%);
  backdrop-filter: blur(calc(var(--glass-blur) * 1.4)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
  -webkit-backdrop-filter: blur(calc(var(--glass-blur) * 1.4)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
  border: 1px solid rgba(var(--wht), 0.15);
  border-radius: var(--r-m);
  padding: 12px 14px;
  box-shadow: 0 12px 40px rgba(var(--blk), 0.55), inset 0 1px 0 rgba(var(--wht), 0.2);
  animation: plate-pop 0.22s var(--spring);
}
@keyframes plate-pop { from { opacity: 0; transform: scale(0.92) translateY(4px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.plate-calc-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.plate-calc-title { font-family: var(--ff-title); font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--t-2); }
.plate-calc-title + .btn-close { width: 20px; height: 20px; min-width: 20px; }
.plate-calc-total { font-family: var(--ff-mono); font-size: 1.1rem; font-weight: 700; color: var(--t-1); margin-bottom: 6px; }
.plate-calc-side { font-size: 0.68rem; color: var(--t-3); font-weight: 500; margin-left: 4px; }
.plate-calc-stack { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.plate-chip {
  background: rgba(var(--wht), 0.05); border: 1px solid var(--border-light);
  border-radius: var(--r-s); padding: 3px 8px;
  font-family: var(--ff-mono); font-size: 0.66rem; font-weight: 600; color: var(--t-2);
}
.plate-chip b { color: var(--accent); font-weight: 800; }
.plate-svg { width: 100%; height: auto; display: block; margin: 4px 0 2px; overflow: visible; }
.plate-svg-bar { fill: rgba(var(--wht), 0.35); }
.plate-svg-plate { fill: rgba(var(--wht), 0.65); stroke: rgba(var(--wht), 0.18); stroke-width: 0.4; }
.plate-calc-remainder { font-size: 0.62rem; color: var(--c-orange); font-weight: 600; margin-top: 4px; }
.plate-calc-empty { font-size: 0.72rem; color: var(--t-3); line-height: 1.5; }

.timer-controls { display: flex; gap: 4px; }

.btn-timer-action {
  width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid var(--border-light);
  background: var(--glass-2); color: var(--t-2);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: var(--t-ui-slow); outline: none;
}

@media (hover: hover) and (pointer: fine) {
  .btn-timer-action:hover {   background: var(--glass-3); color: var(--t-1); border-color: var(--border-strong); 
  }
}
.btn-timer-action:active { transform: scale(0.9); }
.btn-timer-action.text-danger { color: var(--c-red); }

@media (hover: hover) and (pointer: fine) {
  .btn-timer-action.text-danger:hover {   background: rgba(255, 69, 58, 0.12); border-color: rgba(255, 69, 58, 0.25); 
  }
}

.editor-timer-row {
  display: flex; align-items: center; gap: 8px;
  margin-top: 10px; margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-light);
}
.editor-timer-label { font-size: 0.72rem; font-weight: 700; color: var(--t-3); text-transform: uppercase; letter-spacing: 0.05em; }

/* Checkoff buttons */
.btn-set-check {
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(var(--wht), 0.035);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--ff-mono);
  font-size: 0.8rem; font-weight: 700; color: var(--t-2);
  border: 1px solid var(--border-light);
  cursor: pointer; transition: var(--t-ui-slow); outline: none;
}

@media (hover: hover) and (pointer: fine) {
  .btn-set-check:hover {   background: rgba(var(--accent-rgb), 0.1); color: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.18); 
  }
}
.btn-set-check.completed { background: #30D158 !important; border-color: #30D158 !important; color: #ffffff !important; box-shadow: 0 0 10px rgba(48, 209, 88, 0.4); }

.set-row-container.completed .set-input { opacity: 0.65; background: rgba(var(--wht), 0.01) !important; border-color: rgba(var(--wht), 0.02) !important; color: var(--t-3) !important; }
.set-row-container.completed .stepper-wrap { opacity: 0.65; pointer-events: none; }
.set-row-container.completed .note-tags-row { opacity: 0.45; pointer-events: none; }

/* ── Muscle Heatmap Card ────────────────────────────────── */
.heatmap-card { padding: 16px 20px; margin-bottom: 20px; }

.heatmap-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px; border-bottom: 1px solid var(--border-light); padding-bottom: 10px;
}
.heatmap-title { font-family: var(--ff-title); font-size: 0.95rem; font-weight: 700; }
.heatmap-legend { display: flex; gap: 8px; }
.hl-item { font-size: 0.65rem; font-weight: 700; color: var(--t-3); display: flex; align-items: center; gap: 4px; }
.hl-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.hl-dot.lvl-0 { background: rgba(var(--wht), 0.08); }
.hl-dot.lvl-1 { background: rgba(var(--accent-rgb), 0.3); }
.hl-dot.lvl-2 { background: rgba(var(--accent-rgb), 0.65); }
.hl-dot.lvl-3 { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

.heatmap-body { display: flex; justify-content: center; align-items: center; gap: 24px; padding: 10px 0; }

.anatomy-svg-container { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.anatomy-view-label { font-size: 0.58rem; font-weight: 800; color: var(--t-3); text-transform: uppercase; letter-spacing: 0.05em; }
.anatomy-svg { width: 80px; height: 160px; overflow: visible; }

.anatomy-base { fill: url(#gradL0); stroke: rgba(var(--wht), 0.1); stroke-width: 1; stroke-linejoin: round; }
.muscle-path { transition: fill 0.35s ease, filter 0.35s ease, stroke 0.35s ease; stroke: rgba(var(--wht), 0.12); stroke-width: 0.6; stroke-linejoin: round; }
.muscle-path.m-level-0 { fill: url(#gradL0); stroke: rgba(var(--wht), 0.12); }
.muscle-path.m-level-1 { fill: url(#gradL1); stroke: rgba(255, 149, 0, 0.35); }
.muscle-path.m-level-2 { fill: url(#gradL2); stroke: rgba(255, 149, 0, 0.65); }
.muscle-path.m-level-3 { fill: url(#gradL3); stroke: rgba(var(--wht), 0.45); filter: url(#glow3d); }

.history-heatmap-wrap {
  display: flex; gap: 12px;
  background: rgba(var(--wht), 0.01);
  border: 1px solid var(--border-light);
  border-radius: var(--r-m); padding: 10px;
  justify-content: center; align-items: center; margin-top: 12px;
}
.history-heatmap-wrap .anatomy-svg { width: 54px; height: 96px; }
.history-heatmap-wrap .anatomy-view-label { font-size: var(--text-xs); }

.setup-heatmap-wrap {
  display: flex; gap: 16px; justify-content: center; align-items: center;
  background: rgba(var(--wht), 0.01);
  border: 1px solid var(--border-light);
  border-radius: var(--r-m); padding: 10px 14px;
  margin-bottom: 14px; animation: fadeIn 0.3s ease;
}
.setup-heatmap-wrap .anatomy-svg { width: 60px; height: 110px; }

.editor-heatmap-wrap { display: flex; gap: 10px; margin-top: 6px; }
.editor-heatmap-wrap .anatomy-svg { width: 32px; height: 58px; }
.editor-heatmap-wrap .anatomy-view-label { display: none; }

/* ── Exercise Library Dialog ──────────────────────────────── */
.header-actions { display: flex; align-items: center; gap: 6px; }

/* Header icon buttons — mini glass chips, not bare glyphs. Same recipe
   as the tab bar + glass cards (translucent fill, hairline border,
   specular top edge) so the Social/Library/Account trio reads as part
   of one system; --dur-fast/--spring transitions per the motion recipe. */
.btn-lib-icon {
  position: relative;
  width: 36px; height: 36px;
  background: linear-gradient(180deg, rgba(var(--wht), 0.10), rgba(var(--wht), 0.03));
  border: 1px solid rgba(var(--wht), 0.11);
  border-radius: 12px;
  box-shadow: inset 0 1px 0 rgba(var(--wht), 0.20), 0 2px 8px rgba(var(--blk), 0.20);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
  color: var(--t-2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background-color var(--dur-fast) ease,
              border-color var(--dur-fast) ease,
              color var(--dur-fast) ease,
              box-shadow var(--dur-fast) ease,
              transform var(--dur-fast) var(--spring),
              opacity var(--dur-fast) ease;
  -webkit-tap-highlight-color: transparent;
}
.btn-lib-icon:active { transform: scale(0.88); }

@media (hover: hover) and (pointer: fine) {
  .btn-lib-icon:hover {
    color: var(--t-1);
    background: linear-gradient(180deg, rgba(var(--wht), 0.16), rgba(var(--wht), 0.06));
    border-color: rgba(var(--wht), 0.18);
    transform: translateY(-1px);
    box-shadow: inset 0 1px 0 rgba(var(--wht), 0.24), 0 4px 14px rgba(var(--blk), 0.30);
  }
}

/* Active tab in the header: the same accent language the bar uses
   (tinted fill + glow), plus a small indicator dot underneath so the
   state reads at a glance even with the winter theme's dimmed icons. */
.btn-lib-icon.bot-btn.on {
  color: var(--accent);
  background: linear-gradient(180deg, rgba(var(--accent-rgb), 0.22), rgba(var(--accent-rgb), 0.08));
  border-color: rgba(var(--accent-rgb), 0.45);
  box-shadow: inset 0 1px 0 rgba(var(--wht), 0.22),
              0 2px 10px rgba(var(--accent-rgb), 0.25);
}
.btn-lib-icon.bot-btn.on::after {
  content: "";
  position: absolute; left: 50%; bottom: -7px;
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--accent);
  transform: translateX(-50%);
  box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.8);
}
.btn-lib-icon.bot-btn.on .tab-icon { transform: none; filter: none; }
.btn-lib-icon svg { width: 19px; height: 19px; }
.btn-lib-icon .tab-icon { color: inherit; position: static; }

@media (prefers-reduced-motion: reduce) {
  .btn-lib-icon { transition: none; }
  .btn-lib-icon:active { transform: none; }
}

.lib-card {
  width: 92%; max-width: 420px; max-height: 82vh;
  display: flex; flex-direction: column;
  padding: 22px 20px; text-align: left;
  box-shadow: var(--specular-top), 0 20px 50px rgba(var(--blk), 0.6);
}

.lib-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.lib-title { font-family: var(--ff-title); font-size: 1.35rem; font-weight: 800; }

.lib-tabs-container {
  display: flex; gap: 8px; overflow-x: auto;
  padding-bottom: 12px; margin-bottom: 14px;
  border-bottom: 1px solid var(--border-light);
  scrollbar-width: none;
}
.lib-tabs-container::-webkit-scrollbar { display: none; }

.lib-tab {
  padding: 7px 14px;
  background: rgba(var(--wht), 0.03);
  border: 1px solid var(--border-light);
  border-radius: 8px; color: var(--t-2);
  font-size: 0.78rem; font-weight: 700;
  text-transform: uppercase; cursor: pointer;
  white-space: nowrap; transition: var(--t-ui-slow);
}

@media (hover: hover) and (pointer: fine) {
  .lib-tab:hover {   background: rgba(var(--wht), 0.06); color: var(--t-1); 
  }
}
.lib-tab.active { background: rgba(var(--accent-rgb), 0.12); border-color: var(--accent); color: var(--accent); box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.15); }

.lib-body { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
.lib-body::-webkit-scrollbar { width: 4px; }
.lib-body::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }

.lib-exercise-item {
  display: flex; flex-direction: column; gap: 4px;
  padding: 12px 14px;
  background: rgba(var(--wht), 0.02);
  border: 1px solid rgba(var(--wht), 0.03);
  border-radius: var(--r-m);
  transition: var(--t-ui-slow);
  animation: slideUpFade 0.35s var(--spring) both;
}

@media (hover: hover) and (pointer: fine) {
  .lib-exercise-item:hover {   background: rgba(var(--accent-rgb), 0.04); border-color: rgba(var(--accent-rgb), 0.2); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(var(--blk), 0.2); 
  }
}

.lib-ex-name { font-size: 0.95rem; font-weight: 700; }
.lib-ex-muscles { font-size: 0.72rem; font-weight: 600; color: var(--t-3); text-transform: uppercase; letter-spacing: 0.03em; }

@media (hover: hover) and (pointer: fine) {
  .lib-exercise-item:hover .lib-ex-muscles {   color: var(--accent); 
  }
}

@keyframes slideUpFade {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── My Account: Athlete Profile & Find Friends ──────────── */
.profile-hero {
  position: relative; overflow: hidden;
  text-align: center;
  padding: 36px 20px 28px;
  background: linear-gradient(135deg, rgba(var(--wht), 0.05) 0%, rgba(var(--wht), 0.01) 100%);
  border: 1px solid rgba(var(--wht), 0.08);
  border-radius: var(--r-l);
  box-shadow: inset 0 1px 0 rgba(var(--wht), 0.15), 0 12px 40px rgba(var(--blk), 0.6);
}
.profile-glow {
  position: absolute; top: -100px; left: 50%; transform: translateX(-50%);
  width: 320px; height: 240px; pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(var(--accent-rgb), 0.25), rgba(191, 90, 242, 0.1) 40%, transparent 70%);
  filter: blur(10px);
}
/* The ring is the ASCA Score gauge: a conic arc (set inline by
   renderProfile, full circle at 150) — data, not decoration. */
.profile-avatar-ring {
  width: 96px; height: 96px; margin: 0 auto 24px;
  border-radius: 50%; padding: 3px;
  background: conic-gradient(from 220deg, var(--accent), #FFB25A 100deg, rgba(var(--wht), 0.07) 100deg);
  box-shadow: 0 0 24px rgba(var(--accent-rgb), 0.22), 0 8px 32px rgba(var(--blk), 0.3);
  position: relative;
}
.profile-avatar-ring::after {
  content: ''; position: absolute; inset: 1px; border-radius: 50%;
  border: 1px solid rgba(var(--wht), 0.1); pointer-events: none;
}
.profile-score-pill {
  position: absolute; left: 50%; bottom: -13px; transform: translateX(-50%);
  display: flex; align-items: baseline; gap: 4px;
  background: rgba(var(--blk), 0.94);
  border: 1px solid rgba(var(--accent-rgb), 0.45);
  border-radius: var(--r-full); padding: 3px 11px;
  box-shadow: 0 4px 14px rgba(var(--blk), 0.5);
  white-space: nowrap; z-index: 2;
}
.profile-score-pill .as-state-label {
  font-family: var(--ff-title); font-size: 0.62rem; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.09em;
  margin-left: 6px;
  padding-left: 6px; border-left: 1px solid rgba(var(--wht), 0.12);
}
.profile-score-pill span {
  font-family: var(--ff-mono); font-size: 0.88rem; font-weight: 800;
  color: #FFB25A; letter-spacing: -0.02em;
}
.profile-score-pill.approx span::before {
  content: '≈'; font-size: 0.62rem; margin-right: 2px; color: var(--t-3);
}
.profile-score-pill em {
  font-style: normal; font-family: var(--ff-title); font-size: var(--text-xs);
  font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--t-3);
}
.profile-avatar {
  width: 100%; height: 100%; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; font-weight: 800; color: #fff;
  background: #17130f;
  border: 3px solid #000;
  text-transform: uppercase;
}
.profile-name { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.01em; color: #fff; }
.profile-username { font-size: 0.78rem; font-weight: 700; color: var(--t-3); margin-top: 2px; }
.profile-bio { font-size: 0.78rem; font-weight: 500; color: var(--t-2); margin-top: 8px; line-height: 1.45; max-width: 300px; margin-left: auto; margin-right: auto; }

.profile-stats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin: 22px 0 12px;
}
.profile-stat {
  background: rgba(var(--wht), 0.02);
  border: 1px solid rgba(var(--wht), 0.05);
  border-radius: 12px;
  padding: 12px 4px;
  text-align: center;
  box-shadow: inset 0 1px 0 rgba(var(--wht), 0.03), 0 4px 10px rgba(var(--blk), 0.2);
  transition: var(--t-ui-slow);
}

@media (hover: hover) and (pointer: fine) {
  .profile-stat:hover {
    background: rgba(var(--wht), 0.05);
    border-color: rgba(var(--wht), 0.08);
    transform: translateY(-1px);
    box-shadow: inset 0 1px 0 rgba(var(--wht), 0.04), 0 6px 14px rgba(var(--blk), 0.3);
  }
}
.profile-stat-val {
  font-family: var(--ff-mono, monospace);
  font-size: 1.15rem; font-weight: 800;
  color: #fff;
}
.profile-stat-label {
  font-size: var(--text-xs); font-weight: 800;
  color: var(--t-3); text-transform: uppercase;
  letter-spacing: 0.08em; margin-top: 4px;
}

.profile-edit-toggle {
  margin-top: 16px;
  padding: 8px 24px;
  font-size: 0.76rem; font-weight: 700;
  color: #fff; background: rgba(var(--wht), 0.05);
  border: 1px solid rgba(var(--wht), 0.08);
  border-radius: 12px;
  cursor: pointer; transition: var(--t-ui-slow);
  box-shadow: inset 0 1px 0 rgba(var(--wht),0.05);
}

@media (hover: hover) and (pointer: fine) {
  .profile-edit-toggle:hover {
    background: rgba(var(--wht), 0.08);
    border-color: rgba(var(--wht), 0.15);
    box-shadow: 0 4px 12px rgba(var(--blk), 0.2), inset 0 1px 0 rgba(var(--wht),0.05);
  }
}
.profile-edit-toggle:active {
  transform: scale(0.97);
}
.profile-edit {
  max-height: 0; overflow: hidden; opacity: 0;
  transition: max-height 0.3s var(--spring, ease), opacity 0.25s ease, margin 0.3s ease;
  text-align: left;
}
.profile-edit.open { max-height: 480px; opacity: 1; margin-top: 18px; }

.search-input-wrap { position: relative; }
.search-input-wrap .search-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--t-3); pointer-events: none;
}
.search-input-wrap .search-input { padding-left: 40px; }

.user-row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px;
  border-radius: var(--r-m);
  background: rgba(var(--wht), 0.02);
  border: 1px solid rgba(var(--wht), 0.04);
  margin-bottom: 8px;
  transition: var(--t-ui-slow);
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(var(--wht), 0.02);
}

@media (hover: hover) and (pointer: fine) {
  .user-row:hover {
    background: rgba(var(--wht), 0.04);
    border-color: rgba(var(--wht), 0.08);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(var(--blk), 0.25), inset 0 1px 0 rgba(var(--wht), 0.02);
  }
}
.user-row:active {
  transform: scale(0.99);
}
.user-row:last-child { margin-bottom: 0; }
.user-row-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.05rem; font-weight: 800; color: #fff;
  background: linear-gradient(135deg, #3A7BD5, #6FA8FF);
  flex-shrink: 0; text-transform: uppercase;
  box-shadow: 0 4px 12px rgba(58, 123, 213, 0.25);
  border: 2px solid rgba(var(--wht), 0.08);
}
.user-row-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.user-row-name { font-size: 0.9rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; display: flex; align-items: center; }
.user-row-sub { font-size: 0.7rem; font-weight: 500; color: var(--t-3); }
.search-empty { font-size: 0.78rem; color: var(--t-3); padding: 14px; text-align: center; }

/* ── Toggle Switch ─────────────────────────────────────────────
   The app had segmented controls and chips but no boolean switch.
   Token-driven, so it is correct in both themes with no override.  */
.toggle-switch {
  position: relative;
  width: 46px;
  height: 28px;
  flex: 0 0 auto;
  padding: 0;
  border: 1px solid rgba(var(--wht), 0.14);
  border-radius: 14px; /* capsule: radius = half height (28px) */
  background: rgba(var(--wht), 0.06);
  cursor: pointer;
  transition: background 0.25s var(--spring), border-color 0.25s var(--spring);
  -webkit-tap-highlight-color: transparent;
}
.toggle-knob {
  position: absolute;
  top: 50%;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--t-2);
  transform: translateY(-50%);
  transition: transform 0.25s var(--bounce), background 0.25s var(--spring);
  box-shadow: 0 1px 3px rgba(var(--blk), 0.4);
}
.toggle-switch[aria-checked="true"] {
  background: var(--accent-bg);
  border-color: var(--border-strong);
}
.toggle-switch[aria-checked="true"] .toggle-knob {
  transform: translateY(-50%) translateX(18px);
  background: var(--accent);
}
.toggle-switch:active .toggle-knob { width: 24px; }
.toggle-switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── Winter Arc: Dashboard Components ────────────────────────
   Token-driven throughout — no [data-theme="winter"] overrides needed
   here except the one ember accent on the streak flame. Everything
   else re-tints for free because it's built on the same --accent /
   --glass-* / --t-* tokens as the rest of the app.               */

/* Nav tab — hidden until enrolled; gated on [data-arc], not on theme,
   so a Classic-skinned athlete who joined the season keeps their tab. */
.arc-tab-btn { display: none; }
/* Shown when EITHER is true: the Winter Arc theme is on (so a fresh,
   not-yet-enrolled visitor can actually reach the tab to join — the tab
   can't be enrollment-gated only, or nobody could ever enroll), or the
   athlete is already enrolled (so switching back to Classic never hides
   their own season data). */
[data-theme="winter"] .arc-tab-btn,
[data-arc="on"] .arc-tab-btn { display: flex; }

/* Six tabs (Home + Arc + Social + ＋ + Insights + Profile) — Arc enrolled:
   squeeze labels a touch on narrow phones. Grid tracks own widths now;
   these only tighten the label font at the smallest sizes. */
@media (max-width: 440px) {
  [data-arc="on"] .bottom-bar .bot-btn:not(.bot-btn-hero) span { font-size: 0.55rem; }
}

/* ── Onboarding card ── */
.arc-onboard-card {
  text-align: center;
  padding: 32px 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.arc-onboard-icon { font-size: 2.4rem; filter: drop-shadow(0 0 12px var(--accent-bg)); }
.arc-onboard-title { font-family: var(--ff-title); font-weight: 800; font-size: 1.5rem; color: var(--t-1); text-wrap: balance; }
.arc-onboard-sub { font-family: var(--ff-serif); font-style: italic; color: var(--t-2); font-size: 0.95rem; max-width: 280px; text-wrap: pretty; }
.arc-goal-grid {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 6px 0 4px;
  text-align: left;
}
.arc-goal-item {
  background: var(--glass-1);
  border: 1px solid var(--border-light);
  border-radius: var(--r-m);
  padding: 10px 12px;
}
.arc-goal-item-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--t-3); }
.arc-goal-item input {
  width: 100%;
  background: none;
  border: none;
  color: var(--t-1);
  font-family: var(--ff-mono);
  font-size: 1.05rem;
  font-weight: 700;
  padding: 2px 0 0;
  outline: none;
}

/* ── Masthead ──────────────────────────────────────────────────
   No card. The season name, the day count, the date and the season
   rule are page furniture — read, never touched — so nothing here
   earns a border, same as a printed header, not a dashboard widget.
   The day count is the one thing this page is actually about, so it's
   set as a real headline instead of packed into a widget corner. */
.arc-masthead { padding: 4px 2px 0; }
.arc-masthead-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.arc-season-tag {
  font-family: var(--ff-title); font-size: 0.66rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.18em; color: var(--t-3);
}
.arc-day-huge {
  font-family: var(--ff-title); font-weight: 800;
  font-size: 2.2rem; line-height: 1.05; letter-spacing: -0.02em;
  color: var(--t-1); margin-top: 10px;
}
.arc-masthead-meta {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.78rem; font-weight: 600; color: var(--t-3);
  margin-top: 7px;
}
.arc-meta-dot { opacity: 0.5; }
.arc-season-rule { height: 2px; border-radius: 1px; background: var(--glass-2); overflow: hidden; margin-top: 20px; }
.arc-season-rule-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-2, var(--accent))); transition: width 0.6s var(--spring); }
.arc-hero-tag { font-family: var(--ff-serif); font-style: italic; color: var(--t-2); font-size: 0.85rem; margin-top: 14px; text-wrap: pretty; }

/* ── Status ────────────────────────────────────────────────────
   Streak and level/XP — still no card, just a hairline off the
   masthead above and a hairline splitting the two rows: a spec line
   under the headline, not a second panel. */
.arc-status { padding: 18px 2px 0; margin-top: 22px; border-top: 1px solid var(--border-light); }
.arc-status-streak { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; }
.arc-status-div { height: 1px; background: var(--border-light); margin: 18px 0; }
.arc-status-level { display: flex; align-items: center; gap: 16px; }
.arc-level-chip {
  display: flex; align-items: baseline; gap: 5px;
  background: var(--accent-bg);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-full);
  padding: 5px 11px;
  flex: 0 0 auto;
}
.arc-level-chip span { font-size: 1rem; font-weight: 800; color: var(--accent); }
.arc-level-chip em { font-style: normal; font-size: 0.68rem; font-weight: 700; color: var(--t-2); text-transform: uppercase; letter-spacing: 0.04em; }
.arc-xp-wrap { flex: 1; min-width: 0; }
.arc-xp-track { height: 6px; border-radius: 3px; background: var(--glass-2); overflow: hidden; margin-bottom: 4px; }
.arc-xp-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 3px; transition: width 0.6s var(--spring); }
.arc-xp-label { font-size: 0.66rem; color: var(--t-3); font-weight: 600; }

/* ── Section titles ── — bigger and more editorial than the app's
   small-caps .label; "Today" and "This Season" are the only two
   headings on the whole page, so they get to read like headings. */
.arc-section-title { font-family: var(--ff-title); font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; color: var(--t-1); margin: 30px 2px 12px; }
.arc-section-head .arc-section-title { margin: 0; }

/* Every card that remains gets the same slightly-more-generous padding
   than the app's base .card 18px — consistent across the dashboard
   rather than each card inventing its own number. */
.arc-checkin-card { padding: 22px; }
/* Objectives has no card chrome (see markup) — this is what's left to
   bound it: hairlines top and bottom, side padding that lines back up
   with every card's 18-22px inset so it doesn't look like it drifted. */
.arc-obj-panel {
  padding: 2px 6px;
  border-top: 1px solid var(--border-light);
  border-bottom: 1px solid var(--border-light);
  /* #arcDash is a plain block — nothing supplies inter-element spacing
     for free the way the app's flex .view does, so every gap on this
     page is deliberate, not inherited. Check-in is the next thing and
     the one card on this stretch of the page, so it gets the more
     generous of the app's two rhythms. */
  margin-bottom: 22px;
}
.arc-badges-row { margin-top: 14px; }
.arc-streak-flame {
  width: 46px; height: 46px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  /* Fire is the one warm thing in the room — everything else on this
     card (and everywhere else in winter mode) is monochrome. */
  background: rgba(var(--arc-ember-rgb, var(--accent-rgb)), 0.14);
  color: var(--arc-ember, var(--accent));
}
.arc-streak-flame svg { width: 24px; height: 24px; }
.arc-streak-flame.pulse { animation: arcFlamePulse 0.5s var(--bounce); }
@keyframes arcFlamePulse { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }

/* Completion beat — one signature moment per day on Arc: when the last
   objective lands, the day number dims-and-rises while the flame pops.
   Transform/opacity only so nothing reflows under the thumb. Both classes
   fire inside arcApplyCheckin() on completion. (Reduced-motion honored by
   the global blanket at the end of this file.) */
.arc-settling { animation: arcSettleBeat 0.7s var(--arc-settle, var(--spring)) both; }
@keyframes arcSettleBeat {
  0%   { opacity: 0.92; }
  40%  { opacity: 0.62; }
  100% { opacity: 1; }
}
.arc-flame-pop { animation: arcFlamePop 0.55s var(--bounce) both; }
@keyframes arcFlamePop {
  0%   { transform: scale(0.88); filter: brightness(1); }
  55%  { transform: scale(1.22); filter: brightness(1.5); }
  100% { transform: scale(1); filter: brightness(1); }
}
.arc-streak-info { display: flex; flex-direction: column; gap: 4px; }
.arc-streak-num { font-size: 1.6rem; font-weight: 800; color: var(--t-1); line-height: 1; }
.arc-streak-label { font-size: 0.68rem; color: var(--t-3); font-weight: 600; }
.arc-streak-meta { text-align: right; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.arc-streak-best { font-size: 0.68rem; color: var(--t-3); }
.arc-streak-best b { color: var(--t-1); }
.arc-streak-freezes { display: flex; gap: 4px; }
.arc-freeze-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-cyan); opacity: 0.85; }
.arc-freeze-dot.used { background: var(--glass-3); opacity: 0.4; }
.arc-streak-risk {
  font-size: 0.72rem; font-weight: 700; color: var(--c-orange);
  background: var(--c-orange-bg);
  border-radius: var(--r-s);
  padding: 8px 12px;
  /* Was -2px, pulling this UP into the row above instead of separating
     from it — the opposite of what a warning banner needs. */
  margin-top: 16px;
}

/* ── Objectives ── */
.arc-obj-list { display: flex; flex-direction: column; }
.arc-obj-row {
  display: flex; align-items: center; gap: 16px;
  padding: 15px 12px;
  border-bottom: 1px solid var(--border-light);
  cursor: pointer;
  transition: background 0.2s;
}
.arc-obj-row:last-child { border-bottom: none; padding-bottom: 10px; }
.arc-obj-row:first-child { padding-top: 10px; }
.arc-obj-row:active { background: var(--glass-1); }
.arc-obj-icon {
  width: 38px; height: 38px; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: var(--glass-2);
  color: var(--t-3);
  transition: background 0.3s, color 0.3s;
}
.arc-obj-icon svg { width: 18px; height: 18px; }
.arc-obj-row.done .arc-obj-icon { background: var(--accent-bg); color: var(--accent); }
.arc-obj-body { flex: 1; min-width: 0; }
.arc-obj-label { font-size: 0.9rem; font-weight: 700; color: var(--t-1); }
.arc-obj-hint { font-size: 0.7rem; color: var(--t-3); margin-top: 3px; line-height: 1.4; }
.arc-obj-track { height: 4px; border-radius: 2px; background: var(--glass-2); margin-top: 8px; overflow: hidden; }
/* width%, not transform:scaleX — these tracks are ~1px tall leaf nodes with
   no children to reflow, so the usual "never animate width" layout-cost
   argument doesn't apply; scaleX would also visibly stretch the rounded
   end-cap instead of just revealing more of it. Rendered via innerHTML on
   every check-in (see arcAnimateFills in app.js), which is what actually
   makes this transition fire — a fresh node has no "before" state on its
   own, so JS re-arms it from 0% one frame after insertion. */
.arc-obj-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s var(--spring); }
.arc-obj-check {
  width: 22px; height: 22px; flex: 0 0 auto;
  border-radius: 50%;
  border: 1.5px solid var(--border-light);
  display: flex; align-items: center; justify-content: center;
  color: transparent;
  transition: var(--t-ui-slow-bounce);
}
.arc-obj-row.done .arc-obj-check { background: var(--accent); border-color: var(--accent); color: #fff; }
.arc-obj-check svg { width: 13px; height: 13px; }

/* ── Check-in ── */
.arc-checkin-daypicker {
  display: flex; gap: 8px; overflow-x: auto;
  padding-bottom: 16px; margin-bottom: 18px;
  border-bottom: 1px solid var(--border-light);
  scrollbar-width: none;
}
.arc-checkin-daypicker::-webkit-scrollbar { display: none; }
.arc-day-chip {
  flex: 0 0 auto;
  padding: 7px 14px;
  border-radius: var(--r-full);
  background: var(--glass-1);
  border: 1px solid var(--border-light);
  font-size: 0.72rem; font-weight: 700; color: var(--t-3);
  white-space: nowrap;
}
.arc-day-chip.on { background: var(--accent-bg); border-color: var(--border-strong); color: var(--accent); }
.arc-checkin-rows { display: flex; flex-direction: column; gap: 22px; }
.arc-checkin-row { display: flex; align-items: center; gap: 16px; }
.arc-checkin-icon {
  width: 38px; height: 38px; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-m);
  background: var(--glass-2);
  color: var(--t-2);
}
.arc-checkin-icon svg { width: 18px; height: 18px; }
.arc-checkin-row.hit .arc-checkin-icon { background: var(--accent-bg); color: var(--accent); }
.arc-checkin-main { flex: 1; min-width: 0; }
.arc-checkin-toprow { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
.arc-checkin-label { font-size: 0.82rem; font-weight: 700; color: var(--t-1); }
.arc-checkin-val { font-family: var(--ff-mono); font-size: 0.82rem; color: var(--t-2); }
.arc-checkin-val b { color: var(--t-1); }
.arc-checkin-track { height: 5px; border-radius: 3px; background: var(--glass-2); overflow: hidden; margin-bottom: 8px; }
.arc-checkin-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.4s var(--spring); }
.arc-checkin-fill.over { background: var(--c-green); }
.arc-quick-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.arc-quick-btn {
  padding: 5px 12px;
  border-radius: var(--r-full);
  background: var(--glass-2);
  border: 1px solid var(--border-light);
  color: var(--t-1);
  font-size: 0.74rem; font-weight: 700;
  font-family: var(--ff-mono);
  transition: var(--t-ui-slow-bounce);
}
.arc-quick-btn:active { transform: scale(0.92); background: var(--accent-bg); border-color: var(--border-strong); color: var(--accent); }
.arc-quick-btn.arc-quick-neg { color: var(--t-3); }
.arc-quick-custom {
  width: 64px;
  background: var(--glass-1);
  border: 1px solid var(--border-light);
  border-radius: var(--r-s);
  color: var(--t-1);
  font-family: var(--ff-mono);
  font-size: 0.8rem;
  text-align: center;
  padding: 5px 4px;
  outline: none;
}
.arc-quick-custom:focus { border-color: var(--accent); }
.arc-sleep-quality { display: flex; gap: 4px; }
.arc-sq-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--glass-2); border: 1px solid var(--border-light); }
.arc-sq-dot.on { background: var(--accent); border-color: var(--accent); }

.arc-sleep-times { display: flex; gap: 10px; margin-top: 8px; }
.arc-sleep-time-field { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.arc-sleep-time-field span { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--t-4); }
.arc-time-input {
  width: 100%;
  background: var(--glass-1);
  border: 1px solid var(--border-light);
  border-radius: var(--r-s);
  color: var(--t-1);
  font-family: var(--ff-mono);
  font-size: 0.86rem;
  padding: 6px 8px;
  outline: none;
  color-scheme: dark; /* native time-picker UI (Safari/Chrome) matches the dark theme instead of a white popover */
}
.arc-time-input:focus { border-color: var(--border-strong); }

/* ── Lock In note ── */
.arc-note-row { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-light); }
.arc-note-label { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; color: var(--arc-ember, var(--accent)); }
.arc-note-label-text { font-size: 0.8rem; font-weight: 700; color: var(--t-1); }
.arc-note-input {
  width: 100%;
  background: var(--glass-1);
  border: 1px solid var(--border-light);
  border-radius: var(--r-m);
  color: var(--t-1);
  font-family: var(--ff-sans);
  font-size: 0.84rem;
  line-height: 1.4;
  padding: 10px 12px;
  resize: none;
  outline: none;
  transition: border-color 0.2s;
}
.arc-note-input:focus { border-color: rgba(var(--arc-ember-rgb, var(--accent-rgb)), 0.4); }
.arc-note-input::placeholder { color: var(--t-4); }
.arc-note-count { text-align: right; font-family: var(--ff-mono); font-size: 0.62rem; color: var(--t-4); margin-top: 4px; }

/* ── Challenges ── */
.arc-challenge-scroll {
  display: flex; gap: 10px;
  overflow-x: auto; padding: 2px 2px 12px;
  scrollbar-width: none;
}
.arc-challenge-scroll::-webkit-scrollbar { display: none; }
.arc-challenge-card {
  flex: 0 0 auto;
  width: 168px;
  padding: 14px;
  display: flex; flex-direction: column; gap: 8px;
  cursor: pointer;
}
.arc-challenge-icon {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-m);
  background: var(--accent-bg);
  color: var(--accent);
}
.arc-challenge-icon svg { width: 16px; height: 16px; }
.arc-challenge-name { font-size: 0.82rem; font-weight: 700; color: var(--t-1); line-height: 1.25; min-height: 2.1em; text-wrap: pretty; }
.arc-challenge-track { height: 5px; border-radius: 3px; background: var(--glass-2); overflow: hidden; }
.arc-challenge-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.5s var(--spring); }
.arc-challenge-meta { display: flex; justify-content: space-between; font-size: 0.64rem; color: var(--t-3); font-family: var(--ff-mono); }
.arc-challenge-card.done { border-color: var(--border-strong); }
.arc-challenge-card.done .arc-challenge-fill { background: var(--c-green); }
.arc-challenge-empty { padding: 20px; text-align: center; color: var(--t-3); font-size: 0.82rem; }

/* ── Badges ── */
.arc-badges-strip { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
.arc-badges-strip::-webkit-scrollbar { display: none; }
.arc-badge-chip {
  flex: 0 0 auto;
  width: 62px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  text-align: center;
}
.arc-badge-icon {
  width: 48px; height: 48px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem;
  background: linear-gradient(135deg, var(--accent-bg), transparent);
  border: 1px solid var(--border-strong);
}
.arc-badge-chip.locked .arc-badge-icon { background: var(--glass-1); border-color: var(--border-light); filter: grayscale(1); opacity: 0.4; }
.arc-badge-name { font-size: 0.6rem; font-weight: 700; color: var(--t-2); line-height: 1.2; }

/* ── Winter Arc: Challenges Browser + Lock In ────────────────
   Same "components, not a second stylesheet" rule as the dashboard —
   token-driven, minimal theme-specific overrides.                   */

.arc-section-head { display: flex; align-items: center; gap: 8px; margin: 30px 0 12px; }
.arc-seeall-btn {
  font-size: 0.66rem; font-weight: 700; letter-spacing: 0.04em;
  color: var(--accent);
  background: none; border: none; padding: 4px 2px;
  text-transform: uppercase;
}

.arc-lockin-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 10px;
  border-radius: var(--r-full);
  background: var(--glass-2);
  border: 1px solid var(--border-light);
  color: var(--t-2);
  font-size: 0.66rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.03em;
  transition: var(--t-ui-slow-bounce);
}
.arc-lockin-btn:active { transform: scale(0.94); }

@media (hover: hover) and (pointer: fine) {
  .arc-lockin-btn:hover {   color: var(--t-1); border-color: var(--border-strong); 
  }
}

/* ── Challenges browser sheet ── */
.ch-sheet { padding-bottom: 24px; }
.ch-sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 12px; }
.ch-sheet-title { font-family: var(--ff-title); font-weight: 800; font-size: 1.1rem; color: var(--t-1); }
.ch-seg-tabs { margin-bottom: 14px; }
.ch-list { display: flex; flex-direction: column; gap: 10px; }
.ch-card {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
}
.ch-card-icon {
  width: 38px; height: 38px; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-m);
  background: var(--accent-bg);
  color: var(--accent);
}
.ch-card-icon svg { width: 18px; height: 18px; }
.ch-card.done .ch-card-icon { background: rgba(94,234,212,0.15); color: var(--c-green); }
.ch-card-body { flex: 1; min-width: 0; }
.ch-card-name { font-size: 0.86rem; font-weight: 700; color: var(--t-1); }
.ch-card-desc { font-size: 0.7rem; color: var(--t-3); margin: 2px 0 6px; }
.ch-card-track { height: 5px; border-radius: 3px; background: var(--glass-2); overflow: hidden; margin-bottom: 5px; }
.ch-card-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.5s var(--spring); }
.ch-card.done .ch-card-fill { background: var(--c-green); }
.ch-card-meta { display: flex; justify-content: space-between; font-size: 0.62rem; color: var(--t-3); font-family: var(--ff-mono); }
.ch-card-action {
  flex: 0 0 auto;
  padding: 6px 14px;
  border-radius: var(--r-full);
  font-size: 0.68rem; font-weight: 700;
  background: var(--accent-bg);
  border: 1px solid var(--border-strong);
  color: var(--accent);
}
.ch-card-action.leave { background: var(--glass-2); border-color: var(--border-light); color: var(--t-3); }
.ch-card-action.done { background: none; border: none; color: var(--c-green); }
.ch-list-empty { padding: 32px 12px; text-align: center; color: var(--t-3); font-size: 0.82rem; }

/* ── Winter Arc: Locked In (monk mode) ────────────────────────
   A deliberate visual break from the rest of the app. Everywhere else
   is frosted glass, soft gradients, rounded warmth. This is not —
   flat black, hard edges, one colour, nothing decorative. The idea is
   not "another screen" but "the noise turned off": today's mission,
   the numbers that matter, and nothing to scroll past.

   Reuses --bg directly rather than a new token: classic's OLED black
   and winter's near-black both already read as "stark" without help,
   so committing to a special monk-mode palette would be redundant. */
.monk-overlay {
  position: fixed;
  inset: 0;
  z-index: 9995; /* above every sheet/modal (900–9990); below the lock screen (9999) */
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: max(48px, calc(32px + var(--sat))) 24px max(32px, var(--sab));
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.4s var(--arc-settle), visibility 0.4s;
}
.monk-overlay.show { opacity: 1; visibility: visible; pointer-events: auto; }
.monk-exit {
  position: absolute;
  top: max(20px, var(--sat));
  right: 20px;
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: rgba(var(--wht), 0.06);
  color: var(--t-3);
  border: none;
}
.monk-exit:active { background: rgba(var(--wht), 0.12); }

.monk-content { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 28px; }

.monk-day-block { text-align: center; }
.monk-daycounter { font-family: var(--ff-arc-display); font-weight: 700; font-size: 3.6rem; color: var(--t-1); line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; }
.monk-season-label { font-family: var(--ff-title); font-weight: 700; font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--t-4); margin-top: 8px; }

.monk-streak-row { display: flex; align-items: center; gap: 10px; }
.monk-streak-flame { width: 26px; height: 26px; color: var(--arc-ember, var(--accent)); }
.monk-streak-num { font-family: var(--ff-mono); font-weight: 700; font-size: 1.8rem; color: var(--t-1); }
.monk-streak-word { font-family: var(--ff-title); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--t-3); }

.monk-stats-grid { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 1px solid rgba(var(--wht), 0.08); border-bottom: 1px solid rgba(var(--wht), 0.08); padding: 16px 0; }
.monk-stat { text-align: center; }
.monk-stat-val { font-family: var(--ff-mono); font-weight: 700; font-size: 1.15rem; color: var(--t-1); }
.monk-stat-label { font-size: var(--text-xs); letter-spacing: 0.06em; text-transform: uppercase; color: var(--t-3); margin-top: 3px; }

.monk-mission-label { align-self: flex-start; font-family: var(--ff-title); font-weight: 700; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--t-4); }
.monk-obj-list { width: 100%; display: flex; flex-direction: column; gap: 0; margin-top: -14px; }
.monk-obj-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(var(--wht), 0.06); }
.monk-obj-row:last-child { border-bottom: none; }
.monk-obj-box {
  width: 20px; height: 20px; flex: 0 0 auto;
  border: 1.5px solid rgba(var(--wht), 0.25);
  border-radius: 50%; /* hollow circle, not a checkbox square — the minimalist checklist mark */
  display: flex; align-items: center; justify-content: center;
  color: transparent;
}
.monk-obj-row.done .monk-obj-box { background: var(--t-1); border-color: var(--t-1); color: var(--bg); }
.monk-obj-box svg { width: 12px; height: 12px; }
.monk-obj-text { flex: 1; font-size: 0.9rem; font-weight: 600; color: var(--t-2); }
.monk-obj-row.done .monk-obj-text { color: var(--t-4); text-decoration: line-through; text-decoration-color: rgba(var(--wht), 0.2); }

.monk-next {
  width: 100%;
  padding: 16px 18px;
  border: 1px solid rgba(var(--accent-rgb), 0.3);
  border-radius: var(--r-m);
  background: rgba(var(--accent-rgb), 0.08);
  display: flex; align-items: center; gap: 12px;
}
.monk-next-arrow { color: var(--accent); font-family: var(--ff-mono); font-size: 1.2rem; flex: 0 0 auto; }
.monk-next-text { font-size: 0.86rem; font-weight: 700; color: var(--t-1); line-height: 1.35; }

.monk-challenges { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.monk-ch-row { display: flex; align-items: center; gap: 10px; }
.monk-ch-name { flex: 1; font-size: 0.74rem; font-weight: 600; color: var(--t-3); }
.monk-ch-track { width: 64px; height: 3px; border-radius: 2px; background: rgba(var(--wht), 0.1); overflow: hidden; }
.monk-ch-fill { height: 100%; background: var(--t-2); }
.monk-ch-pct { font-family: var(--ff-mono); font-size: 0.68rem; color: var(--t-3); width: 32px; text-align: right; }

@media (max-width: 360px) {
  .monk-daycounter { font-size: 2.8rem; }
  .monk-stats-grid { padding: 12px 0; }
}
