<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Asca Gym — Elite Liquid Glass Tracker">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Asca Gym</title>
  <script>
  /* Pre-paint theme. build.js copies the head verbatim into the built
     artifact and emits it ahead of the inlined stylesheet, so this runs
     before a single pixel of the login screen is painted — no flash of the
     wrong theme while the base64 payload is still unpacking. It only ever
     READS the key; applyTheme() in winter.js is the sole writer.

     Winter Arc is the default: anything other than an EXPLICIT 'classic'
     in storage renders winter — this mirrors WinterArc.getTheme()'s
     default exactly, so a fresh browser never flashes classic first. */
  (function(){try{
    if(localStorage.getItem('asca_gym_theme')!=='classic'){
      document.documentElement.setAttribute('data-theme','winter');
      var m=document.querySelector('meta[name="theme-color"]');
      if(m)m.setAttribute('content','#020407');
    }
  }catch(e){}})();
  </script>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230A84FF' stroke-width='2'><path d='M6 3h12l4 6-10 13L2 9z'/></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&family=Bebas+Neue&display=swap');

:root {
  /* ── Colour channels ─────────────────────────────────────────
     The whole palette is expressed as `rgba(var(--channel), alpha)`
     rather than literal rgba(). Swapping these three lines re-tints
     every glass surface, border, specular highlight and shadow in
     the app at once — which is what makes a second theme a token
     block instead of a second stylesheet. Alphas stay per-rule.   */
  --wht: 255, 255, 255;
  --blk: 0, 0, 0;
  --accent-rgb: 255, 118, 0;

  /* Backgrounds — swapped wholesale by the winter block. */
  --frame-bg: radial-gradient(ellipse at 50% 0%, #0a0812 0%, #010103 100%);
  --veil-1: rgba(20, 14, 30, 0.78);
  --veil-2: rgba(2, 1, 4, 0.94);
  --atmos: none;

  /* Aurora blobs: rgb channel + peak alpha, so one token drives both stops. */
  --blob-1: 160, 90, 255;   --blob-1-a: 0.70;
  --blob-2: 255, 80, 160;   --blob-2-a: 0.60;
  --blob-3: 0, 180, 255;    --blob-3-a: 0.55;
  --blob-4: 255, 160, 0;    --blob-4-a: 0.50;

  /* Activity ramp (gym heatmap). */
  --hm-1: rgba(255, 107, 0, 0.20);
  --hm-2: rgba(255, 107, 0, 0.45);
  --hm-3: rgba(255, 107, 0, 0.70);
  --hm-4: var(--accent);

  /* Pitch Black OLED Base */
  --bg: #000000;
  
  /* Apple Liquid Glass — True Translucent System */
  --glass-1: rgba(var(--wht), 0.03);
  --glass-2: rgba(var(--wht), 0.05);
  --glass-3: rgba(var(--wht), 0.09);
  --glass-hover: rgba(var(--wht), 0.12);
  --glass-active: rgba(var(--wht), 0.18);
  --glass-card: rgba(var(--wht), 0.03);
  --glass-card-hover: rgba(var(--wht), 0.06);
  --glass-surface: linear-gradient(135deg, rgba(var(--wht), 0.06) 0%, rgba(var(--wht), 0.015) 100%);
  
  /* Specular & Refraction — Apple Liquid Glass */
  --specular-top: inset 0 1px 0 0 rgba(var(--wht), 0.28);
  --specular-edge: inset 0 0 0 0.5px rgba(var(--wht), 0.14);
  --glass-glow: 0 8px 32px rgba(var(--blk), 0.45);
  --glass-shine: inset 0 1px 0 0 rgba(var(--wht), 0.28),
                 inset 0 0 0 0.5px rgba(var(--wht), 0.12);
  
  /* Precision Borders */
  --border-light: rgba(var(--wht), 0.1);
  --border-strong: rgba(var(--accent-rgb), 0.25);
  --border-glow: rgba(var(--accent-rgb), 0.3);

  /* Typography Colors */
  --t-1: #ffffff;
  --t-2: rgba(var(--wht), 0.72);
  --t-3: rgba(var(--wht), 0.45);
  --t-4: rgba(var(--wht), 0.2);

  /* Apple HSL Tailored Colors */
  --c-blue: #0A84FF;
  --c-blue-bg: rgba(10, 132, 255, 0.15);
  --c-green: #30D158;
  --c-green-bg: rgba(48, 209, 88, 0.15);
  --c-orange: #FF9F0A;
  --c-orange-bg: rgba(255, 159, 10, 0.15);
  --c-red: #FF453A;
  --c-red-bg: rgba(255, 69, 58, 0.15);
  --c-purple: #BF5AF2;
  --c-purple-bg: rgba(191, 90, 242, 0.15);
  --c-cyan: #64D2FF;
  --c-cyan-bg: rgba(100, 210, 255, 0.15);
  
  --accent: #FF7600;
  --accent-bg: rgba(var(--accent-rgb), 0.15);
  
  /* Radius System — iOS 27 Super-Rounded */
  /* Compressed radius scale: gentle curves, nothing balloon-round */
  --r-xs: 6px;
  --r-s: 8px;
  --r-m: 10px;
  --r-l: 14px;
  --r-xl: 16px;
  --r-full: 10px; /* ex-pill: buttons/chips now softly rounded rects */
  
  /* Safe Area */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  
  /* Easing */
  --spring: cubic-bezier(0.25, 1, 0.5, 1);
  --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  --smooth: cubic-bezier(0.4, 0, 0.2, 1);
  --arc-settle: cubic-bezier(0.25, 1, 0.5, 1);

  /* Motion durations — one scale, so any future retiming happens here. */
  --dur-fast: 150ms;
  --dur-med:  300ms;
  --dur-slow: 500ms;

  /* ── Motion recipe ──────────────────────────────────────────────
     Tappables share ONE recipe: --dur-fast ease for colour/opacity/
     shadow, --dur-fast --spring (transform) for movement, and this
     press value on :active. Call-sites compose the tokens below —
     nothing hardcodes its own 0.2s/scale anymore.
       .tappable { transition: background-color var(--dur-fast) ease, …,
                             transform var(--dur-fast) var(--spring), opacity var(--dur-fast) ease; }
       .tappable:active { transform: scale(var(--press-scale)); }     */
  --press-scale: 0.96;

  /* Spacing — 4px base; the arc/settle spacing story rides these, not
     one-off pixel values spread across the sheet. */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* Type scale — collapsed from the 41 ad-hoc sizes the sheet grew into.
     The values below cover every use today; anything between them is a
     legacy one-off the next Stage 2 touch will normalize. */
  --text-xs:      0.68rem;  /* labels, hints */
  --text-s:       0.82rem;  /* body-small */
  --text-m:       0.98rem;  /* body */
  --text-l:       1.25rem;  /* card titles */
  --text-xl:      2rem;     /* view titles */
  --text-display: 3.25rem;  /* Arc masthead number */

  /* Glass recipe — split into its three parts so themes can de-gloss in
     one place. Every backdrop-filter call-site composes these directly:
       backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright))
     (There's deliberately no --glass-recipe token: custom-property values
     are computed once, so a composite would freeze its parts at parse time
     and ignore theme overrides.) */
  --glass-blur: 20px;
  --glass-sat:  190%;
  --glass-bright: 1.1;
  
  /* Fonts */
  --ff-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
  --ff-serif: 'Playfair Display', Georgia, serif;
  --ff-title: 'Outfit', sans-serif;
  --ff-mono: 'JetBrains Mono', monospace;
  /* Same as --ff-title in Classic (no visual change); Winter Arc swaps it
     for a condensed, heavier display face — see the winter block below. */
  --ff-arc-display: var(--ff-title);

  /* Kept-on-purpose legacy names (css.js audits declared vars). --r-md is the
     value two older call-sites already fall back to when unset. */
  --r-md: var(--r-l);

  /* ── Elevation tiers ─────────────────────────────────────────────
     Three real depths, not a continuous scale. Classic runs lifted &
     glossy; the winter block below flattens toward charcoal-on-charcoal.
     Specificity stays low: components consume the token, not a stack. */
  --elev-1: var(--glass-shine), /* hairline specular, same as cards today */
            var(--glass-glow);
  --elev-2: inset 0 1px 0 0 rgba(var(--wht), 0.32),
            inset 0 0 0 0.5px rgba(var(--wht), 0.16),
            0 20px 56px rgba(var(--blk), 0.60);   /* floating: toast, sheet, modal, set-editor */
}

/* ── Winter Arc Tokens ─────────────────────────────────────────
   The seasonal skin. Same token NAMES as :root, cold values — so
   every one of the ~3900 lines below is already theme-aware and
   needs no winter-specific rule. Set on <html data-theme="winter">
   by the pre-paint script in index.html, so the login screen is
   already winter before the payload unpacks.

   Concept: the world is cold and still; your streak is the only warm
   thing on the screen. --arc-ember is the ONE warm colour and is
   reserved for streaks, day counters and completion moments. Using it
   anywhere else dilutes the whole idea.

   Semantic colours (danger red, success green, medals, rank tiers)
   are deliberately NOT remapped — a red error is red in winter.     */
:root[data-theme="winter"] {
  /* "Locked in" — the whole theme reads like the Monk Mode screen now,
     not a decorative ice skin: darker ground, quieter glass, a serious
     condensed display face. What used to be a bright aurora wash is now
     closer to a held breath — visible, cold, and mostly still. */

  /* Re-tint every glass surface, border, specular and shadow at once.
     Near-monochrome: white, grey, black. Colour is a functional signal
     now (the streak flame, and only the streak flame), not a brand. */
  --wht: 214, 220, 227;          /* cool grey-white, desaturated */
  --blk: 1, 3, 6;                /* near-black */
  --accent-rgb: 226, 231, 236;   /* near-white grey — was glacier cyan */

  --bg: #020407;

  --accent: #E2E7EC;             /* buttons, active states, progress fills — grey-white, not a hue */
  --accent-2: #5B6068;           /* muted slate grey — was aurora violet */
  --accent-3: #666B72;           /* muted grey — was frost mint */
  /* The one exception: fire stays warm. Reserved for the streak flame
     ONLY (see .arc-streak-flame / .monk-streak-flame) — muted well below
     the original's brightness so it reads as an ember, not a highlight. */
  --arc-ember: #A8724A;
  --arc-ember-rgb: 168, 114, 74;

  --ff-arc-display: 'Bebas Neue', var(--ff-title), sans-serif;

  /* Darker, flatter glass — less "lit from within," more charcoal with a
     hairline edge. Halved the lift and dropped the colour cast entirely. */
  --glass-surface: linear-gradient(135deg, rgba(var(--wht), 0.045) 0%, rgba(var(--wht), 0.012) 60%, rgba(var(--wht), 0.02) 100%);

  /* Corner frost is now a suggestion, not a glow — and grey, not blue. */
  --glass-glow: 0 8px 28px rgba(var(--blk), 0.65),
                inset 5px 5px 12px -14px rgba(var(--wht), 0.22),
                inset -5px -5px 12px -14px rgba(var(--wht), 0.16);

  --t-1: #E9EDF1;

  /* Backgrounds. --frame-bg and --veil-* are consumed by rules that live
     inside the build's inline lock-screen slice, which is how the winter
     ground reaches the login screen without moving any slice boundary.
     A void, not a nebula — no colour cast at all. */
  --frame-bg: radial-gradient(ellipse at 50% -10%, #0A0C10 0%, #030406 55%, #000102 100%);
  --veil-1: rgba(8, 9, 12, 0.86);
  --veil-2: rgba(0, 1, 2, 0.97);
  --atmos: radial-gradient(120% 60% at 20% -10%, rgba(var(--wht), 0.045) 0%, transparent 60%),
           radial-gradient(100% 50% at 85% 5%, rgba(var(--wht), 0.035) 0%, transparent 65%),
           radial-gradient(140% 70% at 50% 110%, rgba(var(--wht), 0.02) 0%, transparent 60%);

  /* Aurora blobs — now just grey light, not colour. Present enough that
     the background isn't flat, quiet enough that it reads as restraint. */
  --blob-1: 200, 206, 214;  --blob-1-a: 0.14;
  --blob-2: 150, 155, 163;  --blob-2-a: 0.12;
  --blob-3: 170, 175, 182;  --blob-3-a: 0.08;
  --blob-4: 90, 96, 105;    --blob-4-a: 0.14;

  /* Activity ramp — grey at low intensity, near-white at the top. */
  --hm-1: rgba(var(--wht), 0.20);
  --hm-2: rgba(var(--wht), 0.40);
  --hm-3: rgba(var(--wht), 0.65);
  --hm-4: rgba(var(--wht), 0.95);

  /* c-green / c-cyan are left at their classic values on purpose: they
     colour-code workout day-types and muscle groups elsewhere in the app
     (History, Insights), which is functional, not decorative — recolouring
     them would hurt an existing feature rather than serve this one. */

  /* Completion moments decelerate like cold settling — a longer, heavier
     tail than the UI's everyday --spring. */
  --arc-settle: cubic-bezier(0.16, 1, 0.3, 1);

  /* Winter depth: flatter, closer to raw charcoal. The specular hairline
     stays (that's what keeps glass readable); the ambient glow drops out. */
  --elev-1: var(--glass-shine),
            var(--glass-glow);
  --elev-2: inset 0 1px 0 0 rgba(var(--wht), 0.30),
            inset 0 0 0 0.5px rgba(var(--wht), 0.14),
            0 18px 48px rgba(var(--blk), 0.72);
  /* Colder, tighter glass: less glow, less saturation, still a hint of lift. */
  --glass-sat: 140%;
  --glass-bright: 1.05;
  --glass-blur: 24px;
}



/* ── Reset & Base ─────────────────────────────────────────── */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
}

html {
  font-size: 16px;
  background-color: var(--bg);
  color: var(--t-1);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  height: 100%;
}

body {
  font-family: var(--ff-sans);
  background-color: var(--bg);
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  height: 100%;
}



/* ── Lock Screen Overlay ─────────────────────────────────── */
.lock-screen {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  width: 100vw; height: 100vh;
  z-index: 9999;
  background: radial-gradient(ellipse at 50% 0%, var(--veil-1) 0%, var(--veil-2) 80%);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  opacity: 1;
  visibility: visible;
}

.lock-screen.unlocked {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

/* The login atmosphere. Static, not animated — the screen lives for about
   three seconds and .gradient-mesh does not exist yet at this point (its
   markup is inside .phone-frame, which the payload has not injected). */
.lock-screen::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--atmos);
  pointer-events: none;
}
.lock-card { position: relative; }

/* .card/.glass-card lives outside the inlined lock slice, so .lock-card has
   always rendered UNGLASSED in the built artifact while looking correct in
   dev. Restate the glass recipe here; fixes it in both themes. */
.lock-card {
  background: var(--glass-surface);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
  border: 1px solid rgba(var(--wht), 0.08);
}

.lock-card {
  width: 310px;
  padding: 32px 24px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  box-shadow: 0 30px 70px rgba(var(--blk), 0.8),
              inset 0 1px 1px rgba(var(--wht), 0.1);
  border-radius: 16px;
}

.lock-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.lock-header .brand-logo {
  width: 44px;
  height: 44px;
  color: var(--accent);
  filter: drop-shadow(0 0 10px rgba(255, 107, 0, 0.3));
  margin-bottom: 6px;
}

.lock-title {
  font-family: var(--ff-title);
  font-size: 1.35rem;
  font-weight: 800;
  color: var(--t-1);
  letter-spacing: -0.02em;
}

.lock-subtitle {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--t-4);
  letter-spacing: 0.02em;
}

.pin-dots {
  display: flex;
  gap: 16px;
  margin: 6px 0;
}

.pin-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 1.5px solid rgba(var(--wht), 0.25);
  background: transparent;
  transition: background-color 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s cubic-bezier(0.4, 0, 0.2, 1), color 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.pin-dot.filled {
  background: var(--t-1);
  border-color: var(--t-1);
  box-shadow: 0 0 8px rgba(var(--wht), 0.5);
  transform: scale(1.15);
}

.pin-dots.shake {
  animation: pinShake 0.4s ease;
}

@keyframes pinShake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-8px); }
  40%, 80% { transform: translateX(8px); }
}

.pin-keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  width: 100%;
}

.pin-key {
  aspect-ratio: 1.25;
  border-radius: 14px;
  border: 1px solid rgba(var(--wht), 0.08);
  background: linear-gradient(135deg, rgba(var(--wht), 0.06) 0%, rgba(var(--wht), 0.01) 100%);
  backdrop-filter: blur(15px) saturate(170%) brightness(1.1);
  -webkit-backdrop-filter: blur(15px) saturate(170%) brightness(1.1);
  font-family: var(--ff-mono);
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--t-2);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(var(--wht), 0.2),
              inset 0 0 0 0.5px rgba(var(--wht), 0.08),
              0 3px 8px rgba(var(--blk), 0.2);
  transition: background-color 0.15s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.15s cubic-bezier(0.4, 0, 0.2, 1), color 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.15s cubic-bezier(0.4, 0, 0.2, 1), transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.15s cubic-bezier(0.4, 0, 0.2, 1);
}

@media (hover: hover) and (pointer: fine) {
  .pin-key:hover {
    background: linear-gradient(135deg, rgba(var(--wht), 0.12) 0%, rgba(var(--wht), 0.03) 100%);
    color: var(--t-1);
    border-color: rgba(var(--wht), 0.18);
    box-shadow: inset 0 1px 0 rgba(var(--wht), 0.35),
                0 6px 12px rgba(var(--blk), 0.3);
  }
}

.pin-key:active {
  transform: scale(0.9);
}

.pin-key-empty {
  visibility: hidden;
  pointer-events: none;
}

.pin-key-del {
  background: transparent;
  border-color: transparent;
  color: var(--t-4);
}

@media (hover: hover) and (pointer: fine) {
  .pin-key-del:hover {
    background: transparent;
    border-color: transparent;
    color: var(--t-2);
  }
}

.lock-setup-form {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  width: 100%;
  animation: slideUpFade 0.3s ease;
}

.lock-setup-desc {
  font-size: 0.72rem;
  color: var(--t-3);
  line-height: 1.45;
  margin: 0 0 8px 0;
  text-align: center;
}

.lock-reset-link {
  font-size: 0.68rem;
  color: var(--t-4);
  cursor: pointer;
  text-decoration: underline;
  transition: color 0.2s;
  margin-top: 4px;
}

@media (hover: hover) and (pointer: fine) {
  .lock-reset-link:hover {
    color: var(--accent);
  }
}

.setup-icon-wrapper {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(var(--accent-rgb), 0.08);
  border: 1px solid rgba(var(--accent-rgb), 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
  box-shadow: 0 8px 20px rgba(var(--accent-rgb), 0.15),
              inset 0 1px 1px rgba(var(--wht), 0.1);
  animation: pulseOrange 2.5s infinite alternate;
}

.setup-lock-icon {
  width: 26px;
  height: 26px;
  color: var(--accent);
}

@keyframes pulseOrange {
  0% {
    box-shadow: 0 8px 20px rgba(var(--accent-rgb), 0.15),
                inset 0 1px 1px rgba(var(--wht), 0.1);
    border-color: rgba(var(--accent-rgb), 0.2);
  }
  100% {
    box-shadow: 0 8px 30px rgba(var(--accent-rgb), 0.35),
                inset 0 1px 1px rgba(var(--wht), 0.2);
    border-color: rgba(var(--accent-rgb), 0.5);
  }
}

.lock-heatmap-preview {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  padding: 12px 14px;
  background: rgba(var(--wht), 0.02);
  border: 1px solid rgba(var(--wht), 0.05);
  border-radius: var(--r-m);
  margin: 4px 0 8px 0;
  box-shadow: inset 0 1px 1px rgba(var(--wht), 0.05);
}

.lock-heatmap-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--t-3);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.lock-heatmap-legend {
  display: flex;
  gap: 4px;
}

}

.lock-heatmap-main {

  flex-direction: column;
  position: relative;
  width: 100%;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.lock-heatmap-main::-webkit-scrollbar { display: none; }

.lock-heatmap-months {
  display: block;
  height: 14px;
  position: relative;
  font-size: 0.55rem;

  display: grid;
  grid-auto-columns: 6px;
  grid-template-rows: repeat(7, 6px);
  grid-auto-flow: column;

  width: max-content;
}

.lock-heatmap-dot {
  width: 6px;
  height: 6px;
  border-radius: 1px;
  background: rgba(var(--wht), 0.04);
  transition: transform 0.2s;
  /* Settle-in: with the inline animation-delay build.js stamps onto each
     dot, the grid crystallises left→right on first paint. The slow ease
     (arc-settle) matches the winter theme's "cold settling" feel; classic
     just reads as a considered arrival. Reduced-motion honored at EOF. */
  animation: dotCrystallise 0.5s var(--arc-settle, cubic-bezier(0.25,1,0.5,1)) backwards;
}

@keyframes dotCrystallise {
  from { opacity: 0; transform: scale(0.5); }
  to   { opacity: 1; transform: scale(1); }
}

.lock-heatmap-dot.lvl-1 { background: rgba(var(--wht), 0.22); }
.lock-heatmap-dot.lvl-2 { background: rgba(var(--wht), 0.50); }
.lock-heatmap-dot.lvl-3 { background: rgba(var(--wht), 0.90); }

@media (hover: hover) and (pointer: fine) {

}

/* ═══════════════════════════════════════════════════════════════
   ── Adaptive Responsive System ──────────────────────────────────
   Mobile-first base above; these layer breakpoints on top:
     ≤360   small phones (anti-overflow)
     landscape short screens
     768–1023  tablet (centered wide column)
     ≥1024  desktop app-shell (left sidebar + wide content)
     ≥1280  extra multi-column density
   ═══════════════════════════════════════════════════════════════ */

/* Global safety: nothing should ever cause horizontal scroll */
html, body { max-width: 100%; overflow-x: hidden; }
.card, .glass-card, .view, .views-container { min-width: 0; }

/* ── Small phones ≤360px — kill overflow, tighten spacing ─────── */
@media (max-width: 360px) {
  .views-container { padding-left: 12px; padding-right: 12px; }
  .view-title { font-size: 1.62rem; }
  .view-subtitle { font-size: 0.76rem; }
  .bottom-bar { left: 8px; right: 8px; padding: 0 4px; }
  .bot-btn { width: 50px; font-size: 0.55rem; }
  .h2h-radar-wrap svg { max-width: 100%; height: auto; }
  .lb-podium, .friend-compare, .vol-insight-list, .pr-grid { min-width: 0; }
  .feed-chips { flex-wrap: wrap; }
  .modal { width: 94%; }
  .lb-metric-tabs, .lb-timeframe-tabs, .filter-bar { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .lb-metric-tabs::-webkit-scrollbar, .lb-timeframe-tabs::-webkit-scrollbar, .filter-bar::-webkit-scrollbar { display: none; }
}

/* ── Landscape short screens — reclaim vertical space ─────────── */
@media (max-height: 500px) and (orientation: landscape) {
  .phone-frame { height: auto; min-height: 100dvh; }
  .app-header { padding-top: calc(10px + var(--sat)); padding-bottom: 10px; }
  .bottom-bar { height: 54px; bottom: calc(6px + var(--sab)); }
  .views-container { padding-bottom: calc(78px + var(--sab)); }
}

/* ── Tablet 768–1023 — centered wide column, no device chrome ─── */
@media (min-width: 768px) and (max-width: 1023px) {
  .phone-frame {
    width: min(760px, 94vw);
    height: 94vh;
    max-height: 1100px;
    min-height: 0;
    margin: 3vh auto;
    border-radius: 18px;
    border: 1.5px solid rgba(var(--wht), 0.1);
    box-shadow: 0 40px 100px rgba(var(--blk), 0.9),
                inset 0 1px 2px rgba(var(--wht), 0.12);
  }
  .views-container { padding: 26px 30px calc(104px + var(--sab)); }
  .insights-top-row { gap: 20px; }
  .pr-grid { grid-template-columns: repeat(3, 1fr); }
}

/* ── Desktop ≥1024 — app-shell: left sidebar + wide content ───── */
@media (min-width: 1024px) {
  body { padding: 0; }
  .phone-frame {
    display: grid;
    grid-template-columns: 248px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "nav header" "nav main";
    width: min(1200px, 96vw);
    height: min(940px, 94vh);
    max-height: none;
    min-height: 0;
    margin: auto;
    border-radius: 16px;
    border: 1.5px solid rgba(var(--wht), 0.1);
    box-shadow: 0 40px 110px rgba(var(--blk), 0.92),
                0 0 90px rgba(100, 60, 200, 0.05),
                inset 0 1px 2px rgba(var(--wht), 0.12);
  }

  /* Header spans the content column only; drop the redundant wordmark */
  .app-header {
    grid-area: header;
    justify-content: flex-end;
    gap: 12px;
    padding: calc(20px + var(--sat)) 32px 16px 32px;
  }
  .app-header .brand { display: none; }

  /* Scrolling content region */
  .views-container {
    grid-area: main;
    padding: 26px 34px 40px 34px;
  }

  /* Bottom bar → full-height left sidebar */
  .bottom-bar {
    grid-area: nav;
    position: relative;
    inset: auto;
    left: auto; right: auto; bottom: auto; top: auto;
    width: auto; height: auto;
    flex-direction: column;
    justify-content: flex-start;
    align-items: stretch;
    gap: 6px;
    padding: 22px 14px;
    border: none;
    border-right: 1px solid rgba(var(--wht), 0.08);
    border-radius: 0;
    background: linear-gradient(180deg, rgba(var(--wht), 0.05), rgba(var(--wht), 0.012));
    box-shadow: none;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .bottom-bar::-webkit-scrollbar { display: none; }
  .bottom-bar::before {
    content: "Asca Gym";
    font-family: var(--ff-title);
    font-weight: 800;
    font-size: 1.08rem;
    letter-spacing: -0.01em;
    color: var(--t-1);
    padding: 8px 16px 20px 16px;
  }

  .bot-btn {
    flex-direction: row;
    justify-content: flex-start;
    gap: 14px;
    width: 100%;
    height: auto;
    padding: 13px 16px;
    border-radius: 10px;
    font-size: 0.9rem;
    color: var(--t-2);
    transition: background var(--dur-fast) var(--spring), color var(--dur-fast) var(--spring);
  }
  .bot-btn span { font-size: 0.9rem; font-weight: 700; }
  .bot-btn .tab-icon { width: 22px; height: 22px; }
}
/* Hover gated behind hover-capable pointers — a bare :hover inside a
   viewport media query leaves stale hover on touch desktops. */
@media (min-width: 1024px) and (hover: hover) and (pointer: fine) {
  .bot-btn:hover { background: rgba(var(--wht), 0.05); color: var(--t-1); }
}
@media (min-width: 1024px) {
  .bot-btn.on {
    background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.16), rgba(var(--accent-rgb), 0.05));
    box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), 0.28);
    color: #fff;
  }
  .bot-btn.on .tab-icon { transform: none; color: var(--accent); }
  .nav-lens { display: none !important; }

  /* Rest timer floats inside the content column, clear of the sidebar */
  .global-timer-bar { left: auto; right: 34px; width: min(520px, calc(100% - 296px)); bottom: 26px; }

  /* Give internal grids room to breathe */
  .insights-top-row { gap: 22px; }
  .pr-grid { grid-template-columns: repeat(3, 1fr); }
  .profile-stats { padding: 0; }

  /* Arc's rows (icon — label — value/checkbox) were sized for a 440px
     mobile card. Stretched across the full desktop content pane they
     don't fill the width usefully — the label sits left, the control
     sits right, and the middle is just dead air. A capped, centred
     column reads as a deliberate choice instead of a bug, the way most
     desktop apps treat a list-shaped screen. */
  #vArc { max-width: 560px; margin: 0 auto; width: 100%; }
}

/* ── Wide desktop ≥1280 — genuine two-column content density ──── */
@media (min-width: 1280px) {
  .phone-frame { grid-template-columns: 264px minmax(0, 1fr); }
  /* Feed + history flow into two columns */
  #friendRecent { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .timeline { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  .pr-grid { grid-template-columns: repeat(4, 1fr); }
}

}
.ppx-view-imgwrap { border-radius: var(--r-m); overflow: hidden; margin-bottom: 12px; background: #000; }
.ppx-view-img { width: 100%; max-height: 68vh; object-fit: contain; display: block; }
.ppx-view-cap { font-family: var(--ff-title); font-size: 1rem; font-weight: 800; margin-bottom: 2px; }

/* ── Premium Finish ──────────────────────────────────────────
   Consolidated 2026-09 pass. Lives at the tail so it wins against equal-
   specificity rules above without rewriting them. All theme-aware: zero
   literal colors — every line rides the same tokens as the rest of the
   sheet, so classic and winter stay in lockstep. */

/* View content stages in with a light stagger — the view itself already
   animates (viewSlideIn); this makes its cards land as a cascade, not a
   slab. Scoped to #vLog (the daily-use screen) — Social/Insights refill
   their cards asynchronously, and a stagger would re-fire on every
   refresh there; the single view-level animation already covers them.
   nth-child on direct children, pure CSS. Reduced-motion users get the
   existing blanket override below. */
@media (prefers-reduced-motion: no-preference) {
  #vLog.on > * { animation: viewSlideIn 0.42s var(--spring) backwards; }
  #vLog.on > *:nth-child(1) { animation-delay: 0.00s; }
  #vLog.on > *:nth-child(2) { animation-delay: 0.04s; }
  #vLog.on > *:nth-child(3) { animation-delay: 0.08s; }
  #vLog.on > *:nth-child(4) { animation-delay: 0.12s; }
  #vLog.on > *:nth-child(5) { animation-delay: 0.16s; }
  #vLog.on > *:nth-child(n+6) { animation-delay: 0.20s; }
}

/* Numerals: tabular everywhere a value can change under the eye — stat
   figures, leaderboards, streaks — so digits don't jitter width while
   animating or reflowing. Class-only; the font stays the body face. */
.lb-val, .arc-lb-val, .mini-profile-stat-val, .mini-profile-score,
.podium-score, .stat-val, .arc-lb-rank, .hm-count, .lock-heatmap-legend,
.vol-widget-value, .ring-value, .w-val, .pr-score, .chart-val,
.feed-stat b, .tl-stat-v, .timer-text, .monk-streak-num, .monk-stat-val, .mp-tile-vol {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
  letter-spacing: 0;
}

/* Arc leaderboard rank accent — the podium colors already exist above
   (top1/2/3). Adding the warm ember edge to the streak metric label so
   the winter intent ("streak = the one warm thing") also reads visually. */
.arc-lb-val { letter-spacing: 0.01em; }
.arc-lb-row.me { border: 1px solid rgba(var(--wht), 0.08); border-radius: var(--r-m); }
.arc-lb-row { border-radius: var(--r-m); }

/* Skeleton placeholder for rows while friends' Arc data is in flight —
   a shimmering bar rhythm, not a spinner. Used by .arc-lb-rows.loading.
   The cross-fade to real rows is just reinserting content under the
   existing viewSlideIn fade upstream. */
.arc-lb-skel {
  height: 34px; border-radius: var(--r-m);
  background: linear-gradient(90deg,
    rgba(var(--wht), 0.04) 0%, rgba(var(--wht), 0.09) 40%,
    rgba(var(--wht), 0.04) 80%);
  background-size: 220% 100%;
  animation: arcSkel 1.3s ease-in-out infinite;
}
.arc-lb-skel + .arc-lb-skel { margin-top: 6px; }
.arc-lb-skel:nth-child(2) { animation-delay: 0.12s; width: 86%; }
.arc-lb-skel:nth-child(3) { animation-delay: 0.24s; width: 72%; }
@keyframes arcSkel {
  0%   { background-position: 120% 0; }
  100% { background-position: -120% 0; }
}

/* Focus: a visible ring for keyboard users without changing the touch
   experience. Chromium/Safari both honor :focus-visible — taps don't
   trigger it. Offset-only, no forced border-radius: the outline follows
   each control's own shape, so round controls keep a round ring. */
:focus-visible {
  outline: 2px solid rgba(var(--accent-rgb), 0.65);
  outline-offset: 2px;
}
.btn:focus-visible, .seg-tab:focus-visible, .bot-btn:focus-visible {
  outline-offset: 3px;
}

/* ── Reduced Motion ────────────────────────────────────────────
   Several of this app's animations are infinite (the four mesh blobs,
   the podium medal shimmer, the lock icon pulse, and now the snow and
   aurora). Honour the OS setting rather than overriding it per-rule. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
  .gradient-mesh::after, .gradient-mesh::before { display: none; }
}

/* ═══════════════════════════════════════════════════════════════
   Wrapped view — the year/season story cards' look
   Loaded with the rest of the app; styled independently of themes
   (each card owns its accent via inline style). No element IDs are
   shared with the app below, so the viewer can live totally on top.
   ═══════════════════════════════════════════════════════════════ */

.wrapped-overlay {
  position: fixed; inset: 0;
  z-index: 200;
  background: var(--veil-2, rgba(0, 0, 0, 0.94));
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  display: none;
  align-items: center;
  justify-content: center;
  user-select: none;
}
.wrapped-overlay.open { display: flex; }

.wrap-stage { width: 100%; max-width: 420px; padding: var(--space-4) var(--space-5); position: relative; }

/* The card itself — big, quiet, single-accent. Height is fixed-ish so the
   dots/nav don't jump between cards with different content shapes. */
.wrap-card {
  min-height: 62vh;
  border-radius: var(--r-xl);
  padding: var(--space-6) var(--space-5);
  background: linear-gradient(160deg, rgba(var(--wht), 0.06), rgba(var(--wht), 0.02));
  border: 1px solid rgba(var(--wht), 0.1);
  box-shadow: var(--elev-2);
  text-align: center;
  display: flex; flex-direction: column; justify-content: center;
  gap: var(--space-3);
}
.wrap-card::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  background: radial-gradient(80% 50% at 50% 0%, rgba(var(--wht), 0.08), transparent 70%);
  pointer-events: none;
}
.wrap-eyebrow {
  font-family: var(--ff-title); font-weight: 700;
  font-size: var(--text-xs); letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--wrap-accent, var(--accent));
}
.wrap-title {
  font-family: var(--ff-arc-display, var(--ff-title));
  font-weight: 800;
  font-size: var(--text-display);
  letter-spacing: -0.02em;
  color: var(--t-1);
  line-height: 1.05;
  margin-top: 4px;
}
.wrap-sub { color: var(--t-2); font-weight: 500; }

.wrap-bignum { line-height: 1; margin-top: var(--space-3); }
.wrap-bignum > span { display: block; font-family: var(--ff-mono); font-size: 0.85rem; color: var(--t-3); margin-top: 6px; font-weight: 500; }
.wrap-bignum { font-family: var(--ff-mono); font-weight: 800; font-size: 6.5rem; color: var(--t-1); letter-spacing: -0.04em; }

.wrap-list { display: flex; flex-direction: column; gap: 14px; }
.wrap-li { display: flex; justify-content: space-between; align-items: baseline; }
.wrap-li .k { color: var(--t-3); font-weight: 600; font-size: var(--text-s); }
.wrap-li .v { font-family: var(--ff-mono); font-weight: 700; font-size: var(--text-m); color: var(--t-1); }

.wrap-ring {
  --r: 140px;
  width: var(--r); height: var(--r);
  border-radius: 50%;
  margin: var(--space-3) auto 0;
  box-shadow: var(--elev-1);
}
.wrap-ring-hole { border-radius: 50%; position: absolute; inset: calc(var(--r) * 0.30); background: var(--bg, #000); }
.wrap-ring { position: relative; }
.wrap-ring-legend { display: flex; gap: 14px; justify-content: center; margin-top: var(--space-3); flex-wrap: wrap; }
.wrap-ring-legend span { color: var(--t-2); font-weight: 600; font-size: var(--text-s); display: inline-flex; align-items: center; gap: 6px; }
.wrap-ring-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }

/* dots + nav */
.wrap-dots { position: absolute; bottom: calc(var(--space-5) + var(--sab)); left: 50%; transform: translateX(-50%); display: flex; gap: 7px; }
.wrap-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(var(--wht), 0.22); transition: background 0.3s, transform 0.3s; }
.wrap-dot.on { background: var(--t-1); transform: scale(1.25); }

.wrap-close {
  position: absolute; top: calc(var(--space-4) + var(--sat)); right: var(--space-4);
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--glass-2); border: 1px solid var(--border-light);
  color: var(--t-1); font-size: 1.1rem; cursor: pointer;
  transition: opacity 0.2s, background-color 0.2s;
}
.wrap-close:hover { background: var(--glass-3); }

.wrap-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--glass-2); border: 1px solid var(--border-light);
  color: var(--t-1); font-size: 1.4rem; cursor: pointer;
  transition: opacity 0.2s, transform 0.2s;
}
.wrap-prev { left: var(--space-3); }
.wrap-next { right: var(--space-3); }
.wrap-nav:active { transform: translateY(-50%) scale(0.94); }

/* Share button — only visible on the coda card. */
.wrap-share {
  position: absolute; bottom: calc(var(--space-8) + var(--sab)); left: 50%; transform: translateX(-50%);
  padding: 12px 26px;
  font-size: var(--text-s);
}

/* Card swap: entrance only, keeps rhythm with the archive's other moments. */
.wrap-card { animation: wrapCardIn 0.45s var(--arc-settle, var(--spring)) backwards; }
@keyframes wrapCardIn {
  from { opacity: 0; transform: translateY(18px) scale(0.985); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

  function injectScript(code) {
    const s = document.createElement('script');
    s.textContent = code;
    document.body.appendChild(s);
  }

  // Unpack the app behind the login overlay; app.js owns the login
  // flow (Firebase Auth) and removes the overlay after sign-in.
  function boot() {
    const payload = JSON.parse(decodeURIComponent(escape(atob(PAYLOAD_B64))));

    const style = document.createElement('style');
    style.textContent = payload.css;
    document.head.appendChild(style);

    const wrapper = document.createElement('div');
    wrapper.innerHTML = payload.html;
    while (wrapper.firstChild) {
      document.body.appendChild(wrapper.firstChild);
    }

    injectScript(payload.data);
    if (payload.winter) injectScript(payload.winter);
    if (payload.challenges) injectScript(payload.challenges);
    if (payload.fsync) injectScript(payload.fsync);
    if (payload.arcSync) injectScript(payload.arcSync);
    if (payload.wrapped) injectScript(payload.wrapped);
    injectScript(payload.app);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
